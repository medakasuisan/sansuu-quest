/* ---------- おはなしの既読チェック(発火:クエスト結果画面への遷移時/ホーム帰還時) ---------- */
function checkStoryTriggers() {
  game.story = game.story || { read: {}, meta: {} };
  const queueLenBefore = session.eventQueue.length;
  for (const id of STORY_ORDER) {
    if (id === 'prologue') continue;
    if (game.story.read[id]) continue;
    if (STORY[id].trigger()) {
      game.story.read[id] = true;
      if (id === '4-2') {
        game.story.meta = game.story.meta || {};
        game.story.meta['4-2Boot'] = game.bootId;
      }
      session.eventQueue.push({ type: 'story', id });
      break; /* v5.2 §7-3: 1回の呼び出しにつき新規既読化+キュー投入は最大1話(未読が複数でも次回に持ち越し) */
    }
  }
  /* v6 Phase4b: かざん14話。上の森のループは1行も変更していない。森側で今回すでに
   * 1話キューされていたら、かざん側は次回の呼び出しに持ち越す(既存の「1回1話まで」ペースを維持)。 */
  if (session.eventQueue.length === queueLenBefore) {
    for (const id of STORY_ORDER_KAZAN) {
      if (game.story.read[id]) continue;
      if (STORY[id].trigger()) {
        game.story.read[id] = true;
        if (id === 'k4-2') {
          game.story.meta = game.story.meta || {};
          game.story.meta['k4-2Boot'] = game.bootId;
        }
        session.eventQueue.push({ type: 'story', id });
        break;
      }
    }
  }
  saveGame();
}
/* v4セーブ移行時/QR復元時: 既にトリガー条件を満たしている話は「見たことにする」
 * (再導出)。表示はしない(過去に見ていたはずのため)。 */
function deriveStoryReadFromState() {
  game.story = game.story || { read: {}, meta: {} };
  for (const id of STORY_ORDER) {
    if (id === 'prologue') continue;
    if (STORY[id].trigger()) game.story.read[id] = true;
  }
  /* v6 Phase4b: かざん14話も同じ仕組みで導出する(既存かずのもり分の導出結果は変えない)。 */
  deriveKazanStoryReadFromState();
}
/* v6 Phase4b: かざん専用の導出(単独でも呼べるように分離)。
 * 既存 storyMigrated は既に true なセーブが本番に多数あるため(4aが先に本番稼働済み)、
 * 森側と同じガード(!game.storyMigrated)だけに相乗りすると、かざん分の導出が
 * 一度も走らない既存セーブが生まれてしまう。そのため kazanStoryMigrated で別ガードする。 */
function deriveKazanStoryReadFromState() {
  game.story = game.story || { read: {}, meta: {} };
  for (const id of STORY_ORDER_KAZAN) {
    if (STORY[id].trigger()) game.story.read[id] = true;
  }
}

/* ---------- 会話ウィンドウ(RPG風・タップで送り・スキップ可・背景にSCENE_IMG) ---------- */
/* v5.2 §7-1: 1画面=連続する2〜4行(画面=行の配列)。段落ごとに話者名を小さく表示、
 * (ナ)行(speaker空)は名前なしで表示する。台本の文言(speaker/text)自体は不変。 */
function showStoryOverlay(storyId, onDone) {
  const def = STORY[storyId];
  if (!def) { onDone(); return; }
  let i = 0;
  const bg = el('img', 'story-bg'); bg.src = SCENE_IMG[def.scene] || ''; bg.alt = '';
  const skipBtn = el('button', 'story-skip', 'スキップ'); skipBtn.type = 'button';
  const textEl = el('div', 'story-text');
  const advanceBtn = el('button', 'btn-big story-next-btn', 'つぎへ ▶'); advanceBtn.type = 'button';
  const box = el('div', 'story-box', textEl, advanceBtn);
  const media = el('div', 'story-media', bg, skipBtn);
  const card = el('div', 'event-card pop-in story-card', media, box);
  const overlay = el('div', 'event-overlay story-overlay', card);
  document.body.appendChild(overlay);

  function renderScreen() {
    const screenLines = def.screens[i];
    textEl.replaceChildren();
    for (const line of screenLines) {
      const para = line.speaker
        ? el('p', 'story-para', el('span', 'story-speaker-inline', line.speaker), el('span', 'story-para-text', line.text))
        : el('p', 'story-para', el('span', 'story-para-text', line.text));
      textEl.append(para);
    }
    advanceBtn.textContent = (i === def.screens.length - 1) ? (def.cta || 'とじる') : 'つぎへ ▶';
  }
  function finish() { overlay.remove(); onDone(); }
  function advance() {
    if (i >= def.screens.length - 1) { finish(); return; }
    i++; renderScreen();
  }
  advanceBtn.addEventListener('click', advance);
  textEl.addEventListener('click', advance);
  skipBtn.addEventListener('click', (e) => { e.stopPropagation(); finish(); });
  renderScreen();
}

/* ---------- つまずき傾向の記録(v5-story-bible.md §6.5 準拠) ----------
 * 採点のたび(不正解時のみ)に、単元×ミス分類を集計値として記録する。
 * 個別の問題文・入力値は保存しない(集計のみ)。QRセーブには含めない。 */
const MISS_KEY = 'sq_miss_v1';
const MISS_LABELS = {
  'remainder-forgot': 'あまりの書き忘れ',
  'remainder-wrong': 'あまりの計算ミス',
  'quotient-off1': '九九のさがしすぎ/たりなさすぎ',
  'quotient-wrong': '商のミス',
  'word-setup': '文章題の式立て',
};
/* 正解値givenと問題pから、ミスの種類を判定する。
 * !isCorrectの場合、p.fields.every(...)がfalseになった原因は必ず
 * 「rが不一致(hasR時)」か「qが不一致」のどちらかなので分岐は網羅的。 */
function classifyMiss(p, given, rawValues) {
  const hasR = p.answer.r !== undefined;
  const qWrong = given.q !== p.answer.q;
  if (!qWrong && hasR) {
    const rRaw = rawValues['r'];
    const rEmpty = rRaw === undefined || rRaw === '';
    if (rEmpty && p.answer.r > 0) return 'remainder-forgot';
    return 'remainder-wrong';
  }
  if (qWrong) {
    if (Math.abs(given.q - p.answer.q) === 1) return 'quotient-off1';
    if (p.prompt.word) return 'word-setup';
    return 'quotient-wrong';
  }
  return null;
}
function loadMiss() {
  try {
    const raw = localStorage.getItem(MISS_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if (obj && obj.total && obj.byUnit) return obj;
  } catch (e) { /* こわれていたら初期化 */ }
  return { total: {}, byUnit: {} };
}
function saveMiss(m) { try { localStorage.setItem(MISS_KEY, JSON.stringify(m)); } catch (e) { /* 保存できなくても続行 */ } }
function recordMiss(unitId, cat) {
  if (!cat) return;
  const m = loadMiss();
  m.total[cat] = (m.total[cat] || 0) + 1;
  m.byUnit[unitId] = m.byUnit[unitId] || {};
  m.byUnit[unitId][cat] = (m.byUnit[unitId][cat] || 0) + 1;
  saveMiss(m);
}

/* ---------- マルチタブ同期 ----------
 * 同じブラウザで複数タブを開いた場合、他タブの保存(SAVE_KEY/LOG_KEY/MISS_KEY)を
 * 検知して、ホーム/ずかん/おはなしログ/おうちのひと表示中なら状態を再読込・再描画する。
 * クエストプレイ中(screen-play表示中)は出題状態を壊さないため再読込しない。
 * 簡易な"最後に保存した方が勝つ"設計のため、プレイ中タブが並行してseveGame()する場合は
 * 従来どおりプレイ中タブの保存が最終的に残る(CRDT的なマージは行わない・意図的な簡略化)。 */
function reloadFromStorageIfSafe() {
  if (!game) return;
  const playEl = $('screen-play');
  if (playEl && !playEl.classList.contains('hidden')) return;
  const fresh = loadGame();
  if (fresh) game = fresh;
  if (!$('screen-home').classList.contains('hidden')) renderHome();
  else if (!$('screen-pokedex').classList.contains('hidden')) renderPokedex();
  else if (!$('screen-storybook').classList.contains('hidden')) renderStorybook();
  else if (!$('screen-parent').classList.contains('hidden')) renderParentScreen();
}
window.addEventListener('storage', (e) => {
  if (!e.key || (e.key !== SAVE_KEY && e.key !== LOG_KEY && e.key !== MISS_KEY)) return;
  reloadFromStorageIfSafe();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') reloadFromStorageIfSafe();
});
window.addEventListener('focus', () => reloadFromStorageIfSafe());

/* ---------- 起動時セルフテスト(正しさの担保) ---------- */
function selfTest() {
  const cases = [
    ['calcExact',       () => Generators.calcExact()],
    ['calcRemainder',   () => Generators.calcRemainder()],
    ['wordEqual/exact', () => Generators.wordEqual({ withRemainder: false })],
    ['wordEqual/rem',   () => Generators.wordEqual({ withRemainder: true })],
    ['wordQuota/exact', () => Generators.wordQuota({ withRemainder: false })],
    ['wordQuota/rem',   () => Generators.wordQuota({ withRemainder: true })],
  ];
  let n = 0;
  for (const [name, gen] of cases) {
    for (let i = 0; i < 200; i++) {
      const p = gen();
      assertDivision(p.d);
      for (const f of p.fields) {
        if (!(f.key in p.answer)) throw new Error(`${name}: field ${f.key} has no answer`);
        if (!Number.isInteger(p.answer[f.key]) || p.answer[f.key] < 0)
          throw new Error(`${name}: bad answer for ${f.key}`);
      }
      const v = p.explain.visual;
      if (v.groups * v.groupSize + v.rest !== p.d.a)
        throw new Error(`${name}: visual mismatch`);
      n++;
    }
  }
  console.log(`✅ selfTest passed: ${n} problems verified (a=b×q+r, 0≤r<b, 九九 range, visual consistency)`);

  /* ---- v6 Phase2: かけ算 9生成器の検証(新規ブロック。上のわり算ブロックは変更していない) ---- */
  /* D4: 23×4 の bunpaiSteps が「20×4」「80」「3×4」「12」「92」をこの順で含む */
  const fixture = bunpaiSteps({ a: 23, b: 4, p: 92, parts: { a1: 20, a2: 3 } });
  const fixtureJoined = fixture.join(' / ');
  let cursor = -1;
  for (const token of ['20×4', '**80**', '3×4', '**12**', '**92**']) {
    const idx = fixtureJoined.indexOf(token, cursor + 1);
    if (idx <= cursor) throw new Error(`bunpaiSteps fixture(23×4): "${token}" が正しい順で含まれない: ${fixtureJoined}`);
    cursor = idx;
  }

  const mulCases = [
    ['mulTens',     () => Generators.mulTens()],
    ['mulCalc2x1',  () => Generators.mulCalc2x1()],
    ['mulCalc3x1',  () => Generators.mulCalc3x1()],
    ['mulCalc2x2',  () => Generators.mulCalc2x2()],
    ['mulZero',     () => Generators.mulZero()],
    ['mulLaw',      () => Generators.mulLaw()],
    ['mulEstimate', () => Generators.mulEstimate()],
    ['wordTimes',   () => Generators.wordTimes()],
    ['wordInverse', () => Generators.wordInverse()],
  ];
  let nMul = 0;
  let mul3x1VisualCount = 0, mul3x1Total = 0; // D6 実測用
  for (const [name, gen] of mulCases) {
    for (let i = 0; i < 200; i++) {
      const p = gen();
      assertMulProblem(p.d); // D3: assertMultiplication(A1〜A6)を経由
      for (const f of p.fields) {
        if (!(f.key in p.answer)) throw new Error(`${name}: field ${f.key} has no answer`);
        if (!Number.isInteger(p.answer[f.key]) || p.answer[f.key] < 0)
          throw new Error(`${name}: bad answer for ${f.key}`);
      }
      if (name === 'mulZero' && p.answer.q !== 0) // D5
        throw new Error(`mulZero: answer must be 0, got ${p.answer.q}`);
      const v = p.explain.visual;
      if (name === 'mulCalc3x1') { mul3x1Total++; if (v) mul3x1VisualCount++; }
      if (v) {
        if (!('p' in p.d)) throw new Error(`${name}: visual present but d has no p`);
        if (p.d.p > 60) throw new Error(`${name}: visual should be absent when p>60 (p=${p.d.p})`); // D6
        if (v.groups * v.groupSize + v.rest !== p.d.p) throw new Error(`${name}: visual mismatch`); // D7
      }
      nMul++;
    }
  }
  if (mul3x1VisualCount !== 0)
    throw new Error(`mulCalc3x1: visual should never appear (p is always >60), but ${mul3x1VisualCount}/${mul3x1Total} had visual`);
  console.log(`✅ selfTest(mul) passed: ${nMul} problems verified (a×b=p, bunpai parts, mulZero=0, visual gate p≤60, mulCalc3x1 visual=${mul3x1VisualCount}/${mul3x1Total})`);
  console.log(`✅ selfTest total: ${n + nMul} problems verified`);

  /* CLAUDE.md §3-2: セーブ移行の機械テストも selfTest() の末尾から呼ぶ */
  selfTestSave();
}

function selfTestSave() {
  let n = 0;
  for (const { name, save } of SAVE_FIXTURES) {
    /* mergeIntoDefault は引数を書き換えないので、入力(save)をそのまま「移行前」の参照として使える */
    const before = save;
    const after = mergeIntoDefault(JSON.parse(JSON.stringify(save))); /* 実際のloadGame()と同じくJSON経由のコピーを渡す */

    /* R3-1: 消えない。入力に存在した lines/rares/candy/xp はすべて保持される */
    for (const key of Object.keys(before.lines)) {
      if (JSON.stringify(after.lines[key]) !== JSON.stringify(before.lines[key]))
        throw new Error(`selfTestSave[${name}]: lines[${key}] が消えた/変わった: ${JSON.stringify(after.lines[key])} ≠ ${JSON.stringify(before.lines[key])}`);
    }
    for (const key of Object.keys(before.rares)) {
      if (after.rares[key] !== before.rares[key])
        throw new Error(`selfTestSave[${name}]: rares[${key}] が消えた/変わった`);
    }
    if (after.candy !== before.candy) throw new Error(`selfTestSave[${name}]: candy が変わった`);

    /* R3-2: 巻き戻らない。divCorrect の移行値検証(旧セーブ=totalCorrectで埋まる/新セーブ=既存値を尊重) */
    const hadDivCorrect = before.stats.divCorrect !== undefined;
    const expectedDivCorrect = hadDivCorrect ? before.stats.divCorrect : before.stats.totalCorrect;
    if (after.stats.divCorrect !== expectedDivCorrect)
      throw new Error(`selfTestSave[${name}]: divCorrect migration got ${after.stats.divCorrect}, want ${expectedDivCorrect}`);
    if (after.stats.divCorrect < 0) throw new Error(`selfTestSave[${name}]: divCorrect が負数`);
    /* totalCorrect 自体の意味は変えない(R1) */
    if (after.stats.totalCorrect !== before.stats.totalCorrect)
      throw new Error(`selfTestSave[${name}]: totalCorrect が変わった(意味を変えてはいけない)`);

    /* R3-3: 暴発しない。入力に無い rares キー(additive分)は false のまま・compCelebrated は入力どおり */
    for (const key of [10, 11, 12, 23, 24, 25]) {
      if (!(key in before.rares) && after.rares[key] !== false)
        throw new Error(`selfTestSave[${name}]: 未所持のはずの rares[${key}] が true になった(暴発)`);
    }
    if (after.compCelebrated !== !!before.compCelebrated)
      throw new Error(`selfTestSave[${name}]: compCelebrated が入力と異なる(暴発 or 消失)`);

    /* R3-4: 前に進める。次のなかまへの距離が壊れていない(所持数と閾値の関係が矛盾しない) */
    const ownedCount = [1, 2, 3].filter(l => after.lines[l].owned).length;
    if (ownedCount < ENCOUNTER_AT.length) {

       * (閾値そのものを超えていても、それは「次の1体を迎える権利がある」ことを意味するだけで、
       *  実際の付与は processCorrectAnswer() 側が担う。ここでは値が壊れていない=有限の非負整数であることを保証する)。 */
      if (!Number.isInteger(after.stats.divCorrect) || after.stats.divCorrect < 0)
        throw new Error(`selfTestSave[${name}]: divCorrect が壊れていて前に進められない`);
    }
    const kazanOwnedCount = [4, 5, 6].filter(l => after.lines[l].owned).length;
    if (kazanOwnedCount < ENCOUNTER_AT.length && !Number.isInteger(after.stats.mulCorrect))
      throw new Error(`selfTestSave[${name}]: mulCorrect が壊れていて前に進められない`);

    /* v6 Phase4b: 物語(game.story.read)の移行検証。deriveStoryReadFromState()/
     * deriveKazanStoryReadFromState() は STORY[id].trigger() が参照するグローバル game に
     * 依存するため、テスト対象の after を一時的に game に差し替えて実際のブート導出手順
     * (§3-2-2)をそのままシミュレートする(try/finallyで必ず元に戻す)。 */
    const savedGame = game;
    try {
      game = after;
      const queueLenBefore = session.eventQueue.length;
      if (!after.storyMigrated) { deriveStoryReadFromState(); after.storyMigrated = true; }
      if (!after.kazanStoryMigrated) { deriveKazanStoryReadFromState(); after.kazanStoryMigrated = true; }

      /* S3: 暴発しない。導出は既読フラグを立てるだけで、演出キューには絶対に触れない */
      if (session.eventQueue.length !== queueLenBefore)
        throw new Error(`selfTestSave[${name}]: 導出だけで session.eventQueue が動いた(暴発)`);

      /* S1/S2/S3 共通: 各話について、導出が実際に走ったか(ガードの状態)を踏まえて期待値を計算する。
       * ガードは森(storyMigrated)とかざん(kazanStoryMigrated)で独立(既存の「1回だけ導出」仕様どおり)。
       * 既に true(=過去に導出済みという想定)なら今回は走らないので、期待値は「入力の既読状態のまま」。
       * false(=今回はじめて導出)なら、期待値は「入力の既読状態 または 今のstateでtrigger()がtrue」。
       * これで消えない/巻き戻らない/暴発しないを1つのassertionで同時に検証できる(過不足どちらも検出)。 */
      const forestDerivedThisPass = !before.storyMigrated;
      const kazanDerivedThisPass = !before.kazanStoryMigrated;
      for (const id of STORY_ORDER.filter(i => i !== 'prologue')) {
        const wasRead = !!(before.story && before.story.read && before.story.read[id]);
        const expected = wasRead || (forestDerivedThisPass && STORY[id].trigger());
        const got = !!after.story.read[id];
        if (got !== expected)
          throw new Error(`selfTestSave[${name}]: story.read[${id}] 期待=${expected} 実際=${got}(暴発 or 消失 or 巻き戻り)`);
      }
      for (const id of STORY_ORDER_KAZAN) {
        const wasRead = !!(before.story && before.story.read && before.story.read[id]);
        const expected = wasRead || (kazanDerivedThisPass && STORY[id].trigger());
        const got = !!after.story.read[id];
        if (got !== expected)
          throw new Error(`selfTestSave[${name}]: story.read[${id}] 期待=${expected} 実際=${got}(暴発 or 消失 or 巻き戻り)`);
      }

      /* S4: 前に進める。両ガードが消費されて次回以降は通常の checkStoryTriggers() 経路に戻る */
      if (!after.storyMigrated || !after.kazanStoryMigrated)
        throw new Error(`selfTestSave[${name}]: 移行ガードが消費されず、前に進めない状態のまま`);
    } finally {
      game = savedGame;
    }

    n++;
  }
  console.log(`✅ selfTestSave passed: ${n} fixtures verified (消えない/巻き戻らない/暴発しない/前に進める・物語導出を含む)`);
}
/* ===== 開発用 ここまで ===== */
/* ---------- boot ---------- */
$('btn-quit').addEventListener('click', goHome);
$('btn-check').addEventListener('click', grade);
$('btn-parent-link').addEventListener('click', () => { renderParentScreen(); show('screen-parent'); });
selfTest();
game = loadGame();
const isNewPlayer = !game;
if (!game) game = defaultGame();
game.story = game.story || { read: {}, meta: {} };
game.bootId = (game.bootId || 0) + 1;
if (!game.storyMigrated) { deriveStoryReadFromState(); game.storyMigrated = true; }
/* v6 Phase4b: 森側のガードとは独立に、かざん分の導出を1回だけ走らせる(§3-2-2)。
 * storyMigrated が既に true な既存セーブ(4aが先に本番稼働済みのため多数存在)でも、
 * このガードのおかげで次回起動時に かざんの既読が一度だけ正しく導出される。 */
if (!game.kazanStoryMigrated) { deriveKazanStoryReadFromState(); game.kazanStoryMigrated = true; }
saveGame();
/* 計測: 起動。GA4 の自動収集イベント(session_start/first_visit/page_view/user_engagement)とは
 * 名前が衝突しないように game_launch にしている。 */
sqTrack('game_launch', { is_first_launch: isNewPlayer, boot_bucket: bootBucket(game.bootId) });
/* 計測: クエスト中にページを離れた場合も離脱として拾う。
 * ⚠️ visibilitychange は使わない。モバイルはアプリ切替のたびに hidden になるため、
 *    戻ってきて解き終えたユーザーまで「離脱」に数えて Q2(離脱率) の数字が壊れる。
 *    実際にページを離れる pagehide だけに絞る。 */
window.addEventListener('pagehide', flushAbandon);
function flushAbandon() {
  if (!state.questActive) return;
  state.questActive = false;
  sqTrack('quest_abandon', {
    unit: state.unit ? state.unit.id : 'unknown',
    answered: state.results.length,
    correct: state.correct,
  });
}
const restoredFromQr = restoreFromHash();
if (restoredFromQr) { deriveStoryReadFromState(); game.story.read.prologue = true; saveGame(); }
function bootHome() { checkStoryTriggers(); drainEventQueue(() => { renderHome(); show('screen-home'); }); }
if (restoredFromQr) {
  bootHome();
  showToast('きろくを もどしたよ！');
} else if (isNewPlayer) {
  showIntro(() => { game.introSeen = true; saveGame(); bootHome(); });
} else {
  bootHome();
}

/* Service Worker: オフライン動作の担保(契約 v7-refactor-b)。
 * 未対応ブラウザ・登録失敗でもゲームは通常どおり動くこと(計測と同じくno-op方針)。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
