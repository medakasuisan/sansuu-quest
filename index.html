<style>
  /* ============ tokens ============ */
  :root{
    --bg:#EDF6FF;
    --bg-deco:#DDEEFF;
    --card:#FFFFFF;
    --ink:#29395B;
    --muted:#6B7A99;
    --accent:#FF7A45;
    --accent-deep:#E85D2A;
    --accent-soft:#FFE9DF;
    --sun:#FFC53D;
    --ok:#2FBF8F;
    --ok-soft:#DFF7EE;
    --bad:#FF5D73;
    --bad-soft:#FFE7EA;
    --line:#D6E4F5;
    --plate:#F4F9FF;
    --shadow:0 4px 0 rgba(41,57,91,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101A2E; --bg-deco:#182741; --card:#1B2942;
      --ink:#EAF2FF; --muted:#93A5C4;
      --accent:#FF8F5E; --accent-deep:#FF7A45; --accent-soft:#3A2A22;
      --sun:#FFD166; --ok:#3DD9A4; --ok-soft:#173B31;
      --bad:#FF7A8C; --bad-soft:#3E2229;
      --line:#2C3D5E; --plate:#152238;
      --shadow:0 4px 0 rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#EDF6FF; --bg-deco:#DDEEFF; --card:#FFFFFF;
    --ink:#29395B; --muted:#6B7A99;
    --accent:#FF7A45; --accent-deep:#E85D2A; --accent-soft:#FFE9DF;
    --sun:#FFC53D; --ok:#2FBF8F; --ok-soft:#DFF7EE;
    --bad:#FF5D73; --bad-soft:#FFE7EA;
    --line:#D6E4F5; --plate:#F4F9FF;
    --shadow:0 4px 0 rgba(41,57,91,.10);
  }
  :root[data-theme="dark"]{
    --bg:#101A2E; --bg-deco:#182741; --card:#1B2942;
    --ink:#EAF2FF; --muted:#93A5C4;
    --accent:#FF8F5E; --accent-deep:#FF7A45; --accent-soft:#3A2A22;
    --sun:#FFD166; --ok:#3DD9A4; --ok-soft:#173B31;
    --bad:#FF7A8C; --bad-soft:#3E2229;
    --line:#2C3D5E; --plate:#152238;
    --shadow:0 4px 0 rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:radial-gradient(var(--bg-deco) 12%, transparent 13%);
    background-size:34px 34px;
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:640px;margin:0 auto;padding:20px 16px 56px}
  button{font-family:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}

  /* ============ home ============ */
  .logo{
    text-align:center;margin:28px 0 6px;
    font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:.04em;
    text-wrap:balance;
  }
  .logo .div-mark{
    display:inline-block;background:var(--accent);color:#fff;
    width:1.35em;height:1.35em;line-height:1.35em;border-radius:50%;
    font-size:.72em;vertical-align:.12em;margin-right:.25em;
    box-shadow:var(--shadow);
  }
  .tagline{text-align:center;color:var(--muted);margin:0 0 26px;font-size:15px}

  .unit-label{
    font-size:13px;letter-spacing:.14em;color:var(--muted);
    margin:26px 4px 10px;font-weight:700;
  }
  .mode-grid{display:flex;flex-direction:column;gap:12px}
  .mode-card{
    display:flex;align-items:center;gap:14px;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:20px;
    padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .08s ease;
    font-size:16px;
  }
  .mode-card:hover{border-color:var(--accent)}
  .mode-card:active{transform:translateY(3px);box-shadow:none}
  .mode-card:focus-visible,button:focus-visible,.ans-box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .mode-emoji{
    font-size:30px;width:56px;height:56px;flex:none;
    display:grid;place-items:center;background:var(--plate);border-radius:16px;
  }
  .mode-body{flex:1;min-width:0}
  .mode-title{font-weight:800;font-size:17px}
  .mode-desc{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .mode-go{
    flex:none;background:var(--accent);color:#fff;border-radius:999px;
    font-weight:800;font-size:13px;padding:6px 14px;
  }
  .mode-card.locked{opacity:.55;cursor:default}
  .mode-card.locked:hover{border-color:var(--line)}
  .mode-card.locked:active{transform:none;box-shadow:var(--shadow)}
  .mode-card.locked .mode-go{background:var(--line);color:var(--muted)}
  .mode-card.locked .mode-emoji{filter:grayscale(1) brightness(.7)}

  /* ============ play ============ */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .btn-home{
    background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .btn-home:active{transform:translateY(3px);box-shadow:none}
  .progress{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .p-dot{
    width:18px;height:18px;border-radius:50%;
    background:var(--card);border:2px solid var(--muted);opacity:.5;
    display:grid;place-items:center;font-size:11px;color:#fff;
  }
  .p-dot.hit,.p-dot.miss,.p-dot.now{opacity:1}
  .p-dot.hit{background:var(--sun);border-color:var(--sun)}
  .p-dot.miss{background:var(--line);border-color:var(--line)}
  .p-dot.now{border-color:var(--accent)}
  .streak{
    flex:none;font-weight:800;font-size:14px;color:var(--accent-deep);
    background:var(--accent-soft);border-radius:999px;padding:5px 12px;min-width:64px;text-align:center;
  }

  .q-card{
    background:var(--card);border:2px solid var(--line);border-radius:24px;
    padding:22px 20px 26px;box-shadow:var(--shadow);
  }
  .q-chip{
    display:inline-block;background:var(--plate);color:var(--muted);
    font-size:12px;font-weight:700;letter-spacing:.1em;
    border-radius:999px;padding:4px 12px;margin-bottom:12px;
  }
  .q-calc{
    text-align:center;font-size:clamp(38px,10vw,52px);font-weight:800;
    letter-spacing:.05em;margin:10px 0 6px;
  }
  .q-word{font-size:19px;margin:6px 2px 10px;line-height:2.0}
  .q-word .q-num{font-weight:800;font-size:1.2em;color:var(--accent-deep);padding:0 1px}
  .q-ask{font-weight:800}

  .ans-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
  .ans-field{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ans-label{font-size:13px;font-weight:800;color:var(--muted)}
  .ans-wrap{display:flex;align-items:center;gap:6px}
  .ans-box{
    /* v6 Phase2 追補A-2: 1桁(わり算)のときは従来どおり min-width ぴったりで見た目不変。
     * 3〜4桁(かけ算)のときだけ width:auto で横に伸びる。フォントサイズは変えない。 */
    min-width:96px;width:auto;max-width:200px;padding:0 10px;white-space:nowrap;
    height:64px;border:3px solid var(--line);border-radius:16px;
    background:var(--plate);font-size:34px;font-weight:800;text-align:center;
    display:grid;place-items:center;cursor:pointer;user-select:none;box-sizing:border-box;
  }
  .ans-box.active{border-color:var(--accent);background:var(--accent-soft)}
  .ans-box.empty::after{content:"?";color:var(--muted);opacity:.45}
  .ans-unit{font-size:16px;font-weight:700;color:var(--muted)}

  .pad{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    max-width:320px;margin:16px auto 0;
  }
  .pad button{
    font-size:24px;font-weight:800;padding:13px 0;border-radius:16px;
    border:2px solid var(--line);background:var(--card);cursor:pointer;
    box-shadow:var(--shadow);
  }
  .pad button:active{transform:translateY(3px);box-shadow:none}
  .pad button.pad-fn{font-size:15px;color:var(--muted)}
  .pad button:disabled{opacity:.35;cursor:default}
  .btn-big{
    display:block;width:100%;max-width:320px;margin:18px auto 0;
    background:var(--accent);color:#fff;border:none;border-radius:18px;
    font-size:20px;font-weight:800;padding:15px 0;cursor:pointer;
    box-shadow:0 5px 0 var(--accent-deep);
  }
  .btn-big:active{transform:translateY(4px);box-shadow:none}
  .btn-big.next{background:var(--ok);box-shadow:0 5px 0 rgba(0,0,0,.18)}

  /* ============ feedback ============ */
  .fb{margin-top:18px}
  .fb-banner{
    border-radius:18px;padding:14px 18px;font-size:20px;font-weight:800;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .fb-banner.good{background:var(--ok-soft);color:var(--ok)}
  .fb-banner.bad{background:var(--bad-soft);color:var(--bad)}
  .fb-banner .fb-face{font-size:28px}
  .fb-sub{font-size:14px;font-weight:700;color:var(--muted);margin-left:auto;text-align:right}
  .kaisetsu{
    margin-top:14px;background:var(--plate);border:2px dashed var(--line);
    border-radius:18px;padding:16px 18px;
  }
  .kaisetsu h3{
    margin:0 0 10px;font-size:15px;letter-spacing:.12em;color:var(--accent-deep);
  }
  .step{display:flex;gap:10px;margin:9px 0;font-size:16px;align-items:baseline}
  .step-no{
    flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;
    transform:translateY(3px);
  }
  .step b{color:var(--accent-deep)}
  .kakunin{
    margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--card);
    font-size:15px;font-weight:700;
  }
  .kakunin .ok-mark{color:var(--ok);font-weight:800;margin-left:6px}

  .plates{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .plate{
    background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:8px 10px;min-width:64px;text-align:center;
  }
  .plate.rest{border-style:dashed;border-color:var(--bad)}
  .plate-items{font-size:18px;letter-spacing:2px;line-height:1.5;word-break:break-all;max-width:120px}
  .plate-items.small{font-size:12px;letter-spacing:1px}
  .plate-tag{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px}
  .plate.rest .plate-tag{color:var(--bad)}
  .plate-caption{font-size:13px;color:var(--muted);margin-top:2px}

  /* ============ result ============ */
  .result-card{
    background:var(--card);border:2px solid var(--line);border-radius:24px;
    padding:34px 22px;box-shadow:var(--shadow);text-align:center;
  }
  .result-stars{font-size:34px;letter-spacing:4px;margin-bottom:8px}
  .result-score{font-size:44px;font-weight:800}
  .result-score small{font-size:20px;color:var(--muted)}
  .result-msg{font-size:18px;font-weight:800;margin:10px 0 22px}
  .result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .result-btns .btn-big{width:auto;min-width:150px;margin:0;padding:14px 26px}
  .result-btns .ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}

  /* ============ celebration ============ */
  .celebrate{
    position:fixed;inset:0;pointer-events:none;z-index:60;
    display:grid;place-items:center;overflow:hidden;
  }
  .celebrate.fade{opacity:0;transition:opacity .3s}
  .stamp-wrap{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    animation:stampIn .9s cubic-bezier(.2,1.6,.4,1);
  }
  .stamp{
    font-size:clamp(130px,42vw,240px);line-height:1;
    filter:drop-shadow(0 8px 0 rgba(0,0,0,.12));
    animation:wiggle 1.1s ease-in-out;
  }
  .stamp-text{
    font-size:clamp(26px,7.5vw,42px);font-weight:800;color:var(--accent-deep);
    background:var(--card);border:3px solid var(--sun);border-radius:999px;
    padding:6px 28px;box-shadow:var(--shadow);white-space:nowrap;
  }
  @keyframes stampIn{
    0%{transform:scale(0) rotate(-14deg);opacity:0}
    55%{transform:scale(1.18) rotate(4deg);opacity:1}
    75%{transform:scale(.94) rotate(-2deg)}
    100%{transform:scale(1) rotate(0)}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0)}
    30%{transform:rotate(7deg)}
    60%{transform:rotate(-6deg)}
  }
  .burst{position:fixed;pointer-events:none;z-index:55;animation:fly 1.15s ease-out forwards}
  @keyframes fly{
    from{transform:translate(0,0) scale(.6) rotate(0);opacity:1}
    to{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--spin));opacity:0}
  }
  .confetti{
    position:fixed;top:-24px;pointer-events:none;z-index:54;
    animation:confettiFall var(--dur) ease-in var(--delay) forwards;
    opacity:0;
  }
  @keyframes confettiFall{
    0%{opacity:1;transform:translateY(0) rotate(0)}
    100%{opacity:1;transform:translateY(112vh) rotate(var(--rot))}
  }
  .pop-in{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .shake{animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-3px)}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }

  .hidden{display:none !important}
  footer{
    text-align:center;color:var(--muted);font-size:12px;margin-top:40px;
  }

  /* ============ touch / mobile / tablet ============ */
  html{touch-action:manipulation}
  button,.ans-box,.mode-card,.pad{
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  .pad button{min-height:58px}
  .app{padding-bottom:calc(56px + env(safe-area-inset-bottom))}

  /* スマホ(〜480px): 余白圧縮・タップ面積優先 */
  @media (max-width:480px){
    .app{padding:12px 10px calc(44px + env(safe-area-inset-bottom))}
    .logo{margin-top:16px}
    .q-card{padding:16px 13px 20px;border-radius:20px}
    .q-word{font-size:17px;line-height:1.9}
    .pad{max-width:100%;gap:8px}
    .pad button{font-size:26px;min-height:62px}
    .pad button.pad-fn{font-size:14px}
    .btn-big{max-width:100%;padding:16px 0}
    .ans-box{min-width:82px;width:auto;max-width:180px;padding:0 8px;height:60px;font-size:30px}
    .ans-row{gap:10px}
    .topbar{gap:8px}
    .btn-home{padding:8px 10px;font-size:13px}
    .p-dot{width:14px;height:14px;font-size:9px}
    .streak{min-width:54px;font-size:13px;padding:5px 9px}
    .fb-banner{font-size:18px;padding:12px 14px}
    .kaisetsu{padding:13px 13px}
    .step{font-size:15px}
    .plate-items{font-size:15px;max-width:104px}
    .mode-card{padding:13px 14px;border-radius:18px}
    .mode-emoji{width:48px;height:48px;font-size:26px}
  }
  /* v5.2: せの低い端末(iPhone SEなど〜700px)向け・プレイ画面を縦方向に圧縮して
   * 左下常駐の相棒バッジ(.partner-play)と パッド/こたえあわせボタンが重ならないようにする */
  @media (max-height:700px){
    #screen-play .topbar{margin-bottom:0}
    #screen-play .q-card{padding-top:8px;padding-bottom:10px}
    #screen-play .q-chip{margin-bottom:6px}
    #screen-play .q-calc{font-size:clamp(28px,9vw,38px);margin:6px 0 4px}
    #screen-play .q-word{margin:4px 2px 6px;line-height:1.6}
    #screen-play .ans-row{margin:8px 0 2px}
    #screen-play .pad{margin-top:8px;gap:5px}
    #screen-play .pad button{padding:7px 0;font-size:19px;min-height:0}
    #screen-play .pad button.pad-fn{font-size:12px}
    #screen-play .ans-box{height:44px;min-width:74px;width:auto;max-width:160px;padding:0 6px;font-size:24px}
    #screen-play .btn-big{padding:8px 0;margin-top:8px;font-size:16px}
  }
  /* タブレット(768px〜): ゆったり・タップ面積そのまま大きく */
  @media (min-width:768px){
    .app{max-width:680px}
    .pad{max-width:360px;gap:12px}
    .pad button{min-height:64px;font-size:26px}
    .btn-big{max-width:360px;padding:17px 0;font-size:21px}
    .ans-box{min-width:108px;width:auto;max-width:220px;padding:0 12px;height:70px;font-size:38px}
    .q-word{font-size:21px}
  }

  /* ============ ゲーム層: ホームのステータス ============ */
  .home-status{margin:0 0 18px}
  .status-badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .status-badge{
    background:var(--card);border:2px solid var(--line);border-radius:999px;
    padding:6px 16px;font-weight:800;font-size:15px;box-shadow:var(--shadow);
  }
  .status-actions{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .status-btn{
    background:var(--plate);border:2px solid var(--line);border-radius:14px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .status-btn:active{transform:translateY(2px)}

  /* ============ ゲーム層: イベントオーバーレイ(であい/レベルアップ/しんか) ============ */
  .event-overlay{
    position:fixed;inset:0;z-index:70;background:rgba(16,26,46,.55);
    display:grid;place-items:center;padding:20px;
  }
  .event-card{
    background:var(--card);border-radius:24px;padding:26px 22px;
    max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow);
    max-height:88vh;overflow-y:auto;
  }
  .event-title{font-size:18px;font-weight:800;margin-bottom:10px}
  .event-img{width:150px;height:150px;object-fit:contain;margin:6px auto;display:block}
  .event-img.shake{animation:shake .4s 2}
  .event-name{font-size:17px;font-weight:800;margin:8px 0 16px;color:var(--accent-deep)}

  /* ============ v4: かずのもり 世界観・相棒ホーム・アメ・ミッション ============ */

  /* ラインナップ図鑑コンプ演出のかざんテザー(既存 locked-list 見出し用の微調整) */

  /* ============ v5: アメをあげるモーダルの狭幅対応(feed-row) ============

  .feed-info{flex:1;min-width:0}
  .feed-info .fi-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed-info .fi-level{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ============ v5: おはなし会話ウィンドウ(RPG風・SCENE_IMG背景) ============ */

  /* ============ v5.2: プレイ画面の相棒常駐(§7-5) ============
   * 画面隅(左下)に固定表示。タップ不可・数字パッド/こたえあわせボタンに重ならないよう

  .partner-play{
    position:fixed;left:calc(8px + env(safe-area-inset-left));

  .partner-play.bounce{animation:partnerBounce .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes partnerBounce{

<script>
'use strict';
/* =========================================================================
 * さんすうクエスト — 拡張可能な算数ドリルエンジン
 *
 * アーキテクチャ:
 *   1. Generators   … 問題ジェネレータ群。1生成器 = 1問題タイプ。
 *                     全生成器が共通スキーマ {prompt, fields, answer, explain, d} を返す。
 *   2. CURRICULUM   … 単元 → スキル → 生成器の重み付きプール。
 *                     新単元（かけ算・分数など）は生成器を書いて units に登録するだけ。
 *   3. UIエンジン    … 出題・採点・解説表示。問題スキーマにのみ依存し、
 *                     単元固有の知識を持たない。DOM は textContent ベースで安全に構築。
 *   4. selfTest()   … 起動時に各生成器 200問の数学的不変条件
 *                     (a = b×q + r, 0 ≤ r < b, 九九の範囲, 図と数の一致) を自動検証。
 * ========================================================================= */

/* ---------- analytics (GA4) ----------
 * 送信するのは「どの単元をどれだけ遊んだか」の匿名集計のみ。
 * 問題文・入力値・こたえ・localStorageの中身・QRセーブ文字列は絶対に送らない。
 * gtag未ロード/通信ブロック/オフラインでも必ずno-opにして、ゲーム動作は止めない。 */
function sqTrack(name, params) {
  try {
    if (typeof window.gtag !== 'function') return;
    window.gtag('event', name, params || {});
  } catch (e) { /* 計測失敗はゲーム続行を優先して無視 */ }
}
/* 起動回数はそのままだと準識別子になりうるのでバケット化して送る */
function bootBucket(n) {
  if (!(n > 1)) return '1';
  if (n <= 5) return '2-5';
  if (n <= 20) return '6-20';
  return '21+';
}

/* ---------- utilities ---------- */
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rand(0, arr.length - 1)];
const $ = (id) => document.getElementById(id);

/* ---------- 安全なDOM構築ヘルパー（textContentのみ・XSS不能） ---------- */
function el(tag, cls, ...kids) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  for (const k of kids) {
    if (k === null || k === undefined) continue;
    node.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return node;
}
/* 軽量マークアップ: **強調** → <b> / @@数@@ → 数のハイライト。
 * 入力は全てプログラム生成のテンプレ文字列（外部入力なし）。 */
function fmt(s) {
  const frag = document.createDocumentFragment();
  for (const t of s.split(/(\*\*[^*]*\*\*|@@[^@]*@@)/g)) {
    if (!t) continue;
    if (t.startsWith('**')) frag.append(el('b', null, t.slice(2, -2)));
    else if (t.startsWith('@@')) frag.append(el('span', 'q-num num', t.slice(2, -2)));
    else frag.append(document.createTextNode(t));
  }
  return frag;
}

/* ---------- 割り算の数の生成(正しさの核) ----------
 * 3年生の範囲: わる数 b は 2〜9、商 q は 1〜9(九九で求まる範囲)、
 * あまり r は 0 または 1〜b-1。わられる数は a = b*q + r で必ず構成する。
 * → 構成的に生成するので「割り切れない・範囲外」は原理的に起きない。
 *   さらに assertDivision で二重に保証する。 */
function makeDivision({ withRemainder }) {
  const b = rand(2, 9);
  const q = rand(1, 9);
  const r = withRemainder ? rand(1, b - 1) : 0;
  const a = b * q + r;
  return { a, b, q, r };
}
function assertDivision(d) {
  const { a, b, q, r } = d;
  if (![a, b, q, r].every(Number.isInteger)) throw new Error('non-integer: ' + JSON.stringify(d));
  if (b < 2 || b > 9)  throw new Error('divisor out of range: ' + JSON.stringify(d));
  if (q < 1 || q > 9)  throw new Error('quotient out of range: ' + JSON.stringify(d));
  if (r < 0 || r >= b) throw new Error('remainder invalid: ' + JSON.stringify(d));
  if (b * q + r !== a) throw new Error('a ≠ b*q+r: ' + JSON.stringify(d));
  return true;
}

/* ---------- 解説ステップ(九九ベース・全問題タイプ共通) ---------- */
function kukuSteps(d) {
  const { a, b, q, r } = d;
  const steps = [];
  steps.push(`わる数は **${b}**。**${b}のだんの九九** をつかって考えるよ。`);
  if (r === 0) {
    steps.push(`${b}×${q}＝**${a}**。ぴったり ${a} になった！`);
    steps.push(`だから こたえは **${q}**。わりきれるから、あまりは 0 だよ。`);
  } else {
    steps.push(`${b}×${q}＝${b * q} …… ${a} より小さい(まだ たりる)`);
    steps.push(`${b}×${q + 1}＝${b * (q + 1)} …… ${a} をこえちゃう！ だから こたえは **${q}**。`);
    steps.push(`のこりは ${a}−${b * q}＝**${r}**。これが「あまり」だよ。`);
    steps.push(`あまりの **${r}** は、わる数の **${b}** より かならず小さくなるよ。`);
  }
  return steps;
}
function checkFormula(d) {
  const { a, b, q, r } = d;
  return r === 0 ? `${b} × ${q} ＝ ${a}` : `${b} × ${q} ＋ ${r} ＝ ${a}`;
}

/* ---------- かけ算の数の生成(正しさの核・v6 Phase2) ----------
 * 3年生の範囲(学習指導要領A(3)): easy10=何十×1位数, 2x1=2位数×1位数,
 * 3x1=3位数×1位数, 2x2=2位数×2位数。allowZero は「まと当て」など0のかけ算(K4)を
 * 自然に混ぜたいときのフラグ(1/10で a か b を 0 にする)。
 * → 構成的に生成するので範囲外は原理的に起きない。さらに assertMultiplication で二重に保証する。 */
function makeMultiplication({ digits, allowZero }) {
  let a, b;
  switch (digits) {
    case 'easy10': a = rand(2, 9) * 10; b = rand(2, 9); break;
    case '2x1':    a = rand(11, 99);    b = rand(2, 9); break;
    case '3x1':    a = rand(101, 999);  b = rand(2, 9); break;
    case '2x2':    a = rand(11, 99);    b = rand(11, 99); break;
    default: throw new Error('makeMultiplication: unknown digits ' + digits);
  }
  if (allowZero && rand(1, 10) === 1) {
    if (Math.random() < 0.5) a = 0; else b = 0;
  }
  const p = a * b;
  const parts = { a1: Math.floor(a / 10) * 10, a2: a % 10 };
  if (digits === '2x2') { parts.b1 = Math.floor(b / 10) * 10; parts.b2 = b % 10; }
  return { a, b, p, parts, digits, allowZero: !!allowZero, kind: 'mul' };
}
/* digitsごとの桁範囲(a,bがともに0でないときだけ検査。allowZeroで0になった場合は対象外) */
const MUL_DIGIT_RANGES = {
  easy10: [[20, 90], [2, 9]],
  '2x1':  [[11, 99], [2, 9]],
  '3x1':  [[101, 999], [2, 9]],
  '2x2':  [[11, 99], [11, 99]],
};
function assertMultiplication(d) {
  const { a, b, p, parts, digits } = d;
  if (![a, b, p].every(Number.isInteger) || a < 0 || b < 0 || p < 0)
    throw new Error('non-integer or negative: ' + JSON.stringify(d));
  if (p !== a * b) throw new Error('p ≠ a*b: ' + JSON.stringify(d));               // A2
  if (a !== 0 && b !== 0) {
    const r = MUL_DIGIT_RANGES[digits];
    if (r) {                                                                        // A3
      if (a < r[0][0] || a > r[0][1]) throw new Error('a out of range: ' + JSON.stringify(d));
      if (b < r[1][0] || b > r[1][1]) throw new Error('b out of range: ' + JSON.stringify(d));
      if (digits === 'easy10' && a % 10 !== 0) throw new Error('a not a multiple of 10 for easy10: ' + JSON.stringify(d));
    }
  }
  if (parts.a1 + parts.a2 !== a) throw new Error('a1+a2 ≠ a: ' + JSON.stringify(d)); // A4
  if (parts.a1 % 10 !== 0) throw new Error('a1 not a multiple of 10: ' + JSON.stringify(d)); // A5
  if (parts.b1 !== undefined) {
    if (parts.b1 + parts.b2 !== b) throw new Error('b1+b2 ≠ b: ' + JSON.stringify(d));
    if (parts.b1 % 10 !== 0) throw new Error('b1 not a multiple of 10: ' + JSON.stringify(d));
  }
  if ((a === 0 || b === 0) && p !== 0) throw new Error('0のかけ算の答えが0でない: ' + JSON.stringify(d)); // A6
  return true;
}
/* mulLaw/mulEstimate など a×b=p の形にそのまま収まらない生成器も
 * ここで一括して検証する(nextProblem からも呼ばれる実行時ガード)。 */
function assertMulProblem(d) {
  if (d.variant === 'law') {
    assertMultiplication(d.pair);
    if (d.product !== d.pair.p * d.c) throw new Error('mulLaw: product ≠ pair.p*c: ' + JSON.stringify(d));
    if (d.a !== d.pair.p || d.b !== d.c) throw new Error('mulLaw: a/b mismatch: ' + JSON.stringify(d));
    return true;
  }
  if (d.variant === 'estimate') {
    assertMultiplication(d);
    if (d.aRound % 10 !== 0 || Math.abs(d.aRound - d.a) > 5)
      throw new Error('mulEstimate: rounding invalid: ' + JSON.stringify(d));
    if (d.estimate !== d.aRound * d.b) throw new Error('mulEstimate: estimate ≠ aRound*b: ' + JSON.stringify(d));
    return true;
  }
  return assertMultiplication(d);
}

/* ---------- 解説ステップ(分配法則ベース・かけ算共通) ----------
 * 答えを先に言わず、分けて→かけて→たす、の順で追体験させる。
 * a または b が 0 のときは分配せず「0のかけ算」の説明にする(K4)。
 * digits='2x2' のときは乗数(b)側を分ける(45×23 → 45×20 と 45×3)。 */
function bunpaiSteps(d) {
  const { a, b, p, parts } = d;
  if (a === 0 || b === 0) {
    return [
      'どんな数に **0** を かけても、こたえは **0** だよ。',
      '0に どんな数を かけても、こたえは **0** だよ。',
    ];
  }
  if (parts.b1 !== undefined) {
    return [
      `${b} を **${parts.b1}と${parts.b2}** に分けるよ。`,
      `${a}×${parts.b1}＝**${a * parts.b1}**`,
      `${a}×${parts.b2}＝**${a * parts.b2}**`,
      `${a * parts.b1}＋${a * parts.b2}＝**${p}**`,
    ];
  }
  return [
    `${a} を **${parts.a1}と${parts.a2}** に分けるよ。`,
    `${parts.a1}×${b}＝**${parts.a1 * b}**`,
    `${parts.a2}×${b}＝**${parts.a2 * b}**`,
    `${parts.a1 * b}＋${parts.a2 * b}＝**${p}**`,
  ];
}
/* たしかめ算: かけ算は交換法則で確かめる(K3・憲法「乗法の順序非依存」とも整合) */
function mulCheckFormula(d) { return `${d.b} × ${d.a} ＝ ${d.p}`; }
/* お皿の視覚化(既存 renderVisual をそのまま使う)。DOM爆発防止のため
 * 積が60以下のときだけ付ける(v6 Phase2契約 §2-5)。 */
function mulVisual(d, item) {
  if (d.p > 60) return undefined;
  return {
    emoji: item.emoji, groups: d.b, groupSize: d.a, rest: 0,
    groupTag: '1つぶん', restTag: 'あまり',
    caption: `${item.name}が 1つぶん ${d.a}${item.counter}の ${item.emoji}が ${d.b}つぶんで ${d.p}${item.counter}。`,
  };
}

/* ---------- 問題ジェネレータ ----------
 * 共通スキーマ:
 *   prompt  : {calc:'35 ÷ 8 ＝ ?'} または {word:'…@@数@@…', ask:'問いかけ'}
 *   fields  : [{key, label, unit}]   … 解答欄の定義(UIが自動生成)

 */
const Generators = {

  /* 計算問題(わりきれる) */
  calcExact() {
    const d = makeDivision({ withRemainder: false });
    const item = pick(ITEMS);
    return {
      prompt: { calc: `${d.a} ÷ ${d.b} ＝ ?` },
      fields: [{ key: 'q', label: 'こたえ', unit: '' }],
      answer: { q: d.q },
      explain: {
        steps: kukuSteps(d),
        visual: { emoji: item.emoji, groups: d.b, groupSize: d.q, rest: 0,
                  groupTag: '1つぶん', restTag: 'あまり',
                  caption: `たとえば ${item.name}${d.a}こを ${d.b}つに 同じかずずつ分けると、1つぶんは ${d.q}こ。` },
        checkFormula: checkFormula(d),
      },
      d,
    };
  },

  /* 計算問題(あまりあり。2割は わりきれる問題を混ぜて「あまり0」も考えさせる) */
  calcRemainder() {
    const withRemainder = Math.random() > 0.2;
    const d = makeDivision({ withRemainder });
    const item = pick(ITEMS);
    return {
      prompt: { calc: `${d.a} ÷ ${d.b} ＝ ?` },
      fields: [
        { key: 'q', label: 'こたえ', unit: '' },
        { key: 'r', label: 'あまり', unit: '' },
      ],
      answer: { q: d.q, r: d.r },
      explain: {
        steps: kukuSteps(d),
        visual: { emoji: item.emoji, groups: d.b, groupSize: d.q, rest: d.r,
                  groupTag: '1つぶん', restTag: 'あまり',
                  caption: d.r === 0
                    ? `${item.name}${d.a}こは ${d.b}つに ぴったり分けられるよ。`
                    : `${item.name}${d.a}こを ${d.b}つに分けると、${d.r}こ あまるよ。` },
        checkFormula: checkFormula(d),
      },
      d,
    };
  },

  /* 文章題・等分除(何人かで同じ数ずつ分ける → 1人ぶんは?) */
  wordEqual({ withRemainder }) {
    const d = makeDivision({ withRemainder });
    const item = pick(ITEMS);
    const ask = withRemainder
      ? `1人ぶんは 何${item.counter}に なって、何${item.counter} あまりますか。`
      : `1人ぶんは 何${item.counter}に なりますか。`;
    const fields = [{ key: 'q', label: '1人ぶん', unit: item.counter }];
    if (withRemainder) fields.push({ key: 'r', label: 'あまり', unit: item.counter });
    const steps = [
      `「**${d.b}人で 同じかずずつ**」だから、わり算だね。しきは **${d.a} ÷ ${d.b}**。`,
      ...kukuSteps(d),
      d.r === 0
        ? `こたえ: 1人ぶんは **${d.q}${item.counter}**。`
        : `こたえ: 1人ぶんは **${d.q}${item.counter}** で、**${d.r}${item.counter}** あまる。`,
    ];
    return {
      prompt: {
        word: `${item.emoji} ${item.name}が @@${d.a}@@${item.counter} あります。@@${d.b}@@人で 同じかずずつ 分けます。`,
        ask,
      },
      fields,
      answer: withRemainder ? { q: d.q, r: d.r } : { q: d.q },
      explain: {
        steps,
        visual: { emoji: item.emoji, groups: d.b, groupSize: d.q, rest: d.r,
                  groupTag: '1人ぶん', restTag: 'あまり',
                  caption: `${d.b}人に ${d.q}${item.counter}ずつ くばったところ` },
        checkFormula: checkFormula(d),
      },
      d,
    };
  },

  /* 文章題・包含除(○こずつ分ける → いくつ分できる?) */
  wordQuota({ withRemainder }) {
    const d = makeDivision({ withRemainder });
    const item = pick(ITEMS);
    const box = pick(CONTAINERS);
    const ask = withRemainder
      ? `${box.name}は いくつ できて、何${item.counter} あまりますか。`
      : `${box.name}は いくつ できますか。`;
    const fields = [{ key: 'q', label: `${box.name}のかず`, unit: box.counter }];
    if (withRemainder) fields.push({ key: 'r', label: 'あまり', unit: item.counter });
    const steps = [
      `「**${d.b}${item.counter}ずつ** 分ける」だから、わり算だね。しきは **${d.a} ÷ ${d.b}**。`,
      ...kukuSteps(d),
      d.r === 0
        ? `こたえ: ${box.name}は **${d.q}${box.counter}** できる。`
        : `こたえ: ${box.name}は **${d.q}${box.counter}** できて、**${d.r}${item.counter}** あまる。`,
    ];
    return {
      prompt: {
        word: `${item.emoji} ${item.name}が @@${d.a}@@${item.counter} あります。1つの${box.name}に @@${d.b}@@${item.counter}ずつ 入れます。`,
        ask,
      },
      fields,
      answer: withRemainder ? { q: d.q, r: d.r } : { q: d.q },
      explain: {
        steps,
        /* 包含除は「b個入りの山が q個」なので groups=q, groupSize=b */
        visual: { emoji: item.emoji, groups: d.q, groupSize: d.b, rest: d.r,
                  groupTag: `1${box.counter}`, restTag: 'あまり',
                  caption: `${d.b}${item.counter}ずつの ${box.name}が ${d.q}${box.counter} できたところ` },
        checkFormula: checkFormula(d),
      },
      d,
    };
  },
};

/* ---------- かけ算の問題ジェネレータ(v6 Phase2・共通スキーマは上と同一) ----------
 * わり算の Generators は一切変更していない(不可侵)。既存オブジェクトに

Object.assign(Generators, {

  /* 何十×1位数。「10のたばがいくつ分」で考える(K1導入・bunpaiStepsとは別の説明) */

        ],

    };
  },

  /* 2位数×1位数(分配法則の基本形) */
  mulCalc2x1() {

      answer: { q: d.p },
      explain: { steps: bunpaiSteps(d), visual: mulVisual(d, item), checkFormula: mulCheckFormula(d) },
      d,
    };
  },

  /* 3位数×1位数(積が大きいので visual は常に付かない=DOM爆発防止) */
  mulCalc3x1() {
    const d = makeMultiplication({ digits: '3x1', allowZero: false });
    const item = pick(ITEMS);
    return {
      prompt: { calc: `${d.a} × ${d.b} ＝ ?` },
      fields: [{ key: 'q', label: 'こたえ', unit: '' }],
      answer: { q: d.p },
      explain: { steps: bunpaiSteps(d), visual: mulVisual(d, item), checkFormula: mulCheckFormula(d) },
      d,
    };
  },

  /* 2位数×2位数(乗数側=bを分ける分配法則) */
  mulCalc2x2() {
    const d = makeMultiplication({ digits: '2x2', allowZero: false });
    const item = pick(ITEMS);
    return {
      prompt: { calc: `${d.a} × ${d.b} ＝ ?` },
      fields: [{ key: 'q', label: 'こたえ', unit: '' }],
      answer: { q: d.p },
      explain: { steps: bunpaiSteps(d), visual: mulVisual(d, item), checkFormula: mulCheckFormula(d) },
      d,
    };
  },

  /* まと当て文脈の0のかけ算(K4)。答えは必ず0になるまで引き直す */
  mulZero() {
    let d;
    do { d = makeMultiplication({ digits: '2x1', allowZero: true }); } while (d.a !== 0 && d.b !== 0);
    return {
      prompt: { calc: `${d.a} × ${d.b} ＝ ?` },
      fields: [{ key: 'q', label: 'とくてん', unit: 'てん' }],
      answer: { q: d.p },
      explain: {
        steps: [
          '🎯 まと当てゲームで、**0点** の まとに 何回 あてても とくてんは ふえないよ。',
          ...bunpaiSteps(d),
        ],
        visual: undefined,
        checkFormula: mulCheckFormula(d),
      },
      d,
    };
  },

  /* 計算のきまり(交換・結合)を使って くふうして計算する(K3) */
  mulLaw() {
    const pairs = [[2, 5], [4, 25], [5, 20], [25, 4], [5, 2], [20, 5]];
    const [p1, p2] = pick(pairs);
    const pair = { a: p1, b: p2, p: p1 * p2, parts: { a1: Math.floor(p1 / 10) * 10, a2: p1 % 10 }, digits: 'lawPair', kind: 'mul' };
    const c = rand(2, 9);
    const product = pair.p * c;
    const order = pick(['cxy', 'xcy', 'xyc']);
    const arr = order === 'cxy' ? [c, p1, p2] : order === 'xcy' ? [p1, c, p2] : [p1, p2, c];
    const d = { kind: 'mul', variant: 'law', pair, c, product, a: pair.p, b: c };
    return {
      prompt: { calc: `${arr[0]} × ${arr[1]} × ${arr[2]} ＝ ?` },
      fields: [{ key: 'q', label: 'こたえ', unit: '' }],
      answer: { q: product },
      explain: {
        steps: [
          'かけ算は じゅんばんを かえても こたえは 同じ(**計算のきまり**)だよ。',
          `${p1} と ${p2} を 先に 計算すると、${p1}×${p2}＝**${pair.p}**(キリのいい数!)`,
          `のこりの ${c} を かけて、${pair.p}×${c}＝**${product}**。`,
        ],
        visual: undefined,
        checkFormula: `${c} × ${p2} × ${p1} ＝ ${product}`,
      },
      d,
    };
  },

  /* 見積り(がい数)。2択UIが無いので「aを一番近い10のくらいにしてから計算する」数値解答に落とす(K5) */
  mulEstimate() {
    const base = makeMultiplication({ digits: '2x1', allowZero: false });
    const aRound = Math.round(base.a / 10) * 10;
    const estimate = aRound * base.b;
    const d = { ...base, variant: 'estimate', aRound, estimate };
    return {
      prompt: {
        word: `見積り(がい数)で 考えるよ。@@${d.a}@@ × @@${d.b}@@ は だいたい いくつに なるかな？`,
        ask: `${d.a} を 一番近い10のくらいの数にしてから 計算しよう。`,
      },
      fields: [{ key: 'q', label: '見積り', unit: '' }],
      answer: { q: estimate },
      explain: {
        steps: [
          `${d.a} を 一番近い10のくらいにすると **${aRound}** だよ。`,
          `${aRound}×${d.b}＝**${estimate}**。これが 見積りの こたえ。`,
        ],
        visual: undefined,
        checkFormula: `${d.b} × ${aRound} ＝ ${estimate}`,
      },
      d,
    };
  },

  /* 文章題・倍(単価×こすうで だい金をもとめる。K2) */
  wordTimes() {
    const digits = pick(['2x1', '2x2']);
    const d = makeMultiplication({ digits, allowZero: false });
    const item = pick(ITEMS);
    const steps = [
      `「1${item.counter} ${d.a}円」の **${d.b}${item.counter}ぶん** だから、かけ算だね。しきは **${d.a}×${d.b}**。`,
      ...bunpaiSteps(d),
      `こたえ: ぜんぶで **${d.p}円**。`,
    ];
    return {
      prompt: {
        word: `${item.emoji} 1${item.counter} @@${d.a}@@円の ${item.name}を @@${d.b}@@${item.counter} 買います。`,
        ask: 'ぜんぶで 何円に なりますか。',
      },
      fields: [{ key: 'q', label: 'だい金', unit: '円' }],
      answer: { q: d.p },
      explain: { steps, visual: mulVisual(d, item), checkFormula: mulCheckFormula(d) },
      d,
    };
  },

  /* 文章題・除法の逆(同じ数ずつ分けた1つぶんから、はじめの数をもとめる。K2) */
  wordInverse() {
    const d = makeMultiplication({ digits: '2x1', allowZero: false });
    const item = pick(ITEMS);
    const steps = [
      `「1人ぶんが ${d.a}${item.counter}」で「${d.b}人ぶん」だから、はじめの数は かけ算で もとめられるよ。しきは **${d.a}×${d.b}**。`,
      ...bunpaiSteps(d),
      `こたえ: はじめは **${d.p}${item.counter}** あった。`,
    ];
    return {
      prompt: {
        word: `${item.emoji} ${item.name}を @@${d.b}@@人で 同じ数ずつ 分けたら、1人ぶんは @@${d.a}@@${item.counter}に なりました。`,
        ask: `はじめに ${item.name}は 何${item.counter} ありましたか。`,
      },
      fields: [{ key: 'q', label: 'はじめの数', unit: item.counter }],
      answer: { q: d.p },
      explain: { steps, visual: mulVisual(d, item), checkFormula: mulCheckFormula(d) },
      d,
    };
  },
});

function drawFromPool(pool) {
  const total = pool.reduce((s, p) => s + p.weight, 0);
  let roll = Math.random() * total;
  for (const p of pool) { roll -= p.weight; if (roll <= 0) return p.gen(); }
  return pool[pool.length - 1].gen();
}

/* d.kind==='mul' ならかけ算の検証、それ以外(従来どおり)はわり算の検証。
 * わり算側の assertDivision は一切変更していない(不可侵)。単元をまたいで
 * nextProblem を共有するための最小限のディスパッチ。 */
function assertProblem(d) {
  return (d && d.kind === 'mul') ? assertMulProblem(d) : assertDivision(d);
}

/* 直前と同じ式 (a,b) の連続を避けつつ生成。invariant も必ず通す */
function nextProblem(unit, prev) {
  for (let i = 0; i < 30; i++) {
    const p = drawFromPool(unit.pool);
    assertProblem(p.d);
    if (!prev || p.d.a !== prev.d.a || p.d.b !== prev.d.b) return p;
  }
  return drawFromPool(unit.pool);
}


/* =========================================================================
 * UI エンジン
 * ========================================================================= */
const state = {
  unit: null, index: 0, correct: 0, streak: 0,
  problem: null, prevProblem: null, results: [], activeField: null, values: {},
  /* 計測用(ゲームロジックには影響しない): クエスト所要時間と途中離脱の判定に使う */
  questActive: false, startedAt: 0, bestStreak: 0,
};
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ゲーム層の状態(単元非依存)。実体は起動時に loadGame()/defaultGame() で決まる。 */
let game = null;
/* 1クエスト内だけの一時状態(できごとの表示キュー・今回ゲットした子) */
const session = { eventQueue: [], caughtThisSession: [] };

function show(screenId) {
  /* 計測: プレイ中に別画面へ抜けた=途中離脱。showResult()は先にquestActive=falseにするので
   * 正常クリアはここに入らない。 */
  if (state.questActive && screenId !== 'screen-play') {
    state.questActive = false;
    sqTrack('quest_abandon', {
      unit: state.unit ? state.unit.id : 'unknown',
      answered: state.results.length,
      correct: state.correct,
    });
  }
  sqTrack('screen_open', { screen: screenId.replace('screen-', '') });
  ['screen-home', 'screen-play', 'screen-result', 'screen-pokedex', 'screen-parent', 'screen-storybook'].forEach(id =>
    $(id).classList.toggle('hidden', id !== screenId));
  window.scrollTo(0, 0);
  /* v5.2 §7-5: プレイ画面のときだけ相棒バッジを表示 */
  if (screenId === 'screen-play') updatePartnerPlayBadge(); else hidePartnerPlayBadge();
}

/* ---------- home ---------- */
function renderHome() {
  renderHomeStatus();
  /* v6 Phase4b: エリア表示の分離。もり(わり算)/かざん(かけ算)を別セクションに描画する。
   * Phase2追補Aで暫定中立化した見出しはここで正式な2セクションに置き換わった。 */
  const mori = $('mode-list-mori'); mori.replaceChildren();
  const kazan = $('mode-list-kazan'); kazan.replaceChildren();
  const locked = $('locked-list'); locked.replaceChildren();
  for (const u of CURRICULUM.units) {
    const card = el('button', 'mode-card' + (u.enabled ? '' : ' locked'),
      el('span', 'mode-emoji', u.emoji),

        el('span', 'mode-title', u.title),
        el('span', 'mode-desc', u.desc)),
      el('span', 'mode-go', u.enabled ? 'スタート' : '🔒'));
    if (u.enabled) card.addEventListener('click', () => startQuest(u));
    else card.setAttribute('aria-disabled', 'true');
    if (!u.enabled) { locked.appendChild(card); continue; }
    (u.id.startsWith('mul-') ? kazan : mori).appendChild(card);
  }
}

/* ---------- quest flow ---------- */
function startQuest(unit) {
  /* 計測: 前クエストが未終了なら「先に」離脱を確定させる。
   * 下の state リセットより前に撃たないと answered/correct が 0 になるので順序厳守。 */
  if (state.questActive) {
    sqTrack('quest_abandon', {
      unit: state.unit ? state.unit.id : 'unknown',
      answered: state.results.length,
      correct: state.correct,
    });
  }
  state.unit = unit; state.index = 0; state.correct = 0; state.streak = 0;
  state.results = []; state.prevProblem = null;
  session.eventQueue = []; session.caughtThisSession = [];
  state.questActive = true;
  state.startedAt = Date.now();
  state.bestStreak = 0;
  sqTrack('quest_start', { unit: unit.id });
  show('screen-play');
  loadProblem();
}

function loadProblem() {
  const u = state.unit;
  state.problem = nextProblem(u, state.prevProblem);
  state.prevProblem = state.problem;
  state.values = {}; state.activeField = state.problem.fields[0].key;

  $('q-chip').textContent = `もんだい ${state.index + 1} / ${u.questions}`;
  renderPrompt();
  renderAnswerRow();
  renderPad();
  renderProgress();
  $('streak').textContent = `🔥 ${state.streak}`;
  const fb = $('fb-area');
  fb.classList.add('hidden'); fb.replaceChildren();
  $('input-area').classList.remove('hidden');
  const card = $('q-card');
  card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
}

function renderPrompt() {
  const body = $('q-body'); body.replaceChildren();
  const pr = state.problem.prompt;
  if (pr.calc) {
    body.append(el('div', 'q-calc num', pr.calc));
  } else {
    const para = el('p', 'q-word', fmt(pr.word), ' ');
    para.append(el('span', 'q-ask', pr.ask));
    body.append(para);
  }
}

function renderProgress() {
  const box = $('progress'); box.replaceChildren();
  for (let i = 0; i < state.unit.questions; i++) {
    const dot = el('span', 'p-dot');
    if (i < state.results.length) {
      dot.classList.add(state.results[i] ? 'hit' : 'miss');
      if (state.results[i]) dot.textContent = '★';
    } else if (i === state.index) dot.classList.add('now');
    box.appendChild(dot);
  }
}

function renderAnswerRow() {
  const row = $('ans-row'); row.replaceChildren();
  for (const f of state.problem.fields) {
    const box = el('span', 'ans-box empty num');
    box.dataset.key = f.key;
    box.setAttribute('role', 'textbox');
    box.setAttribute('tabindex', '0');
    box.setAttribute('aria-label', f.label);
    box.addEventListener('click', () => setActiveField(f.key));
    box.addEventListener('focus', () => setActiveField(f.key));
    const wrap = el('span', 'ans-wrap', box);
    if (f.unit) wrap.append(el('span', 'ans-unit', f.unit));
    row.append(el('div', 'ans-field', el('span', 'ans-label', f.label), wrap));
  }
  syncAnswerBoxes();
}

function setActiveField(key) { state.activeField = key; syncAnswerBoxes(); }

function syncAnswerBoxes() {
  document.querySelectorAll('.ans-box').forEach(box => {
    const key = box.dataset.key;
    const val = state.values[key];
    box.textContent = (val === undefined || val === '') ? '' : val;
    box.classList.toggle('empty', val === undefined || val === '');
    box.classList.toggle('active', key === state.activeField);
  });
}

function renderPad() {
  const pad = $('pad'); pad.replaceChildren();
  for (const k of ['1','2','3','4','5','6','7','8','9']) {
    const b = el('button', null, k);
    b.type = 'button';
    b.addEventListener('click', () => padInput(k));
    pad.appendChild(b);
  }
  const del = el('button', 'pad-fn', '⌫ けす');
  del.type = 'button';
  del.addEventListener('click', padDelete);
  pad.appendChild(del);

  const zero = el('button', null, '0');
  zero.type = 'button';
  zero.addEventListener('click', () => padInput('0'));
  pad.appendChild(zero);

  const nextField = el('button', 'pad-fn', '→ つぎのマス');
  nextField.type = 'button';
  nextField.addEventListener('click', cycleField);
  if (state.problem.fields.length < 2) nextField.disabled = true;
  pad.appendChild(nextField);
}

function padInput(digit) {
  const cur = state.values[state.activeField] || '';
  /* v6 Phase2 追補A-1: わり算は答えが常に1桁(商1〜9/あまり0〜8)だが、
   * かけ算は積が最大4桁(999×9=8991等)になるため上限を2→4に拡張。 */
  if (cur.length >= 4) return;
  state.values[state.activeField] = cur === '0' ? digit : cur + digit;
  syncAnswerBoxes();
}
function padDelete() {
  const cur = state.values[state.activeField] || '';
  state.values[state.activeField] = cur.slice(0, -1);
  syncAnswerBoxes();
}
function cycleField() {
  const keys = state.problem.fields.map(f => f.key);
  const i = keys.indexOf(state.activeField);
  setActiveField(keys[(i + 1) % keys.length]);
}

/* physical keyboard */
document.addEventListener('keydown', (e) => {
  if ($('screen-play').classList.contains('hidden')) return;
  if (!$('fb-area').classList.contains('hidden')) {
    if (e.key === 'Enter') { const nb = $('btn-next'); if (nb) nb.click(); }
    return;
  }
  if (/^[0-9]$/.test(e.key)) padInput(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); padDelete(); }
  else if (e.key === 'Tab') { e.preventDefault(); cycleField(); }
  else if (e.key === 'Enter') grade();
});

/* ---------- grading ---------- */
function grade() {
  const p = state.problem;
  /* 商のマスは必須。あまりのマスは空欄=0 とみなす(「わりきれた」判断も採点対象) */
  const qRaw = state.values['q'];
  if (qRaw === undefined || qRaw === '') {
    const box = document.querySelector('.ans-box[data-key="q"]');
    if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    setActiveField('q');
    return;
  }
  const given = {};
  for (const f of p.fields) {
    const raw = state.values[f.key];
    given[f.key] = (raw === undefined || raw === '') ? 0 : parseInt(raw, 10);
  }
  const isCorrect = p.fields.every(f => given[f.key] === p.answer[f.key]);
  /* v5: つまずき傾向の記録(採点のたび・ミスのみ分類)。個別の問題文/入力値は保存しない(集計のみ)。 */
  if (!isCorrect) recordMiss(state.unit.id, classifyMiss(p, given, state.values));

  /* 計測: 不正解の傾向のみ送る。問題文・入力値・こたえは送らない(単元と種別だけ)。 */
  if (!isCorrect) {
    const wrongField = p.fields.find(f => given[f.key] !== p.answer[f.key]);
    sqTrack('wrong_answer', {
      unit: state.unit.id,
      has_remainder: p.fields.some(f => f.key === 'r'),
      is_word: state.unit.id === 'div-word',
      field: wrongField ? wrongField.key : 'unknown',
    });
  }

  state.results.push(isCorrect);
  if (isCorrect) { state.correct++; state.streak++; } else { state.streak = 0; }
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  $('streak').textContent = `🔥 ${state.streak}`;
  renderProgress();

  /* ゲーム層フック: ✗のときは何もしない(罰ゼロ)。正誤にかかわらないマイルストーンのみ判定。 */
  game.stats.totalAnswered++;
  if (isCorrect) processCorrectAnswer();
  checkTotalAnsweredMilestone();

  showFeedback(isCorrect);
  if (isCorrect) celebrate();
}

function answerText(p) {
  return p.fields.map(f => `${f.label}: ${p.answer[f.key]}${f.unit || ''}`).join(' / ');
}

function showFeedback(isCorrect) {
  const p = state.problem;
  $('input-area').classList.add('hidden');
  const fb = $('fb-area');
  fb.classList.remove('hidden');
  fb.replaceChildren();

  /* banner */
  let banner;
  if (isCorrect) {
    const praise = pick(['やったね！', 'すごい！', 'その調子！', 'かんぺき！', 'ナイス！']);
    banner = el('div', 'fb-banner good pop-in',
      el('span', 'fb-face', '⭕'), `せいかい！ ${praise}`);
    if (state.streak >= 3) banner.append(el('span', 'fb-sub num', `🔥${state.streak}れんぞく！`));
  } else {
    const cheer = pick(['おしい！', 'だいじょうぶ！', 'つぎは できるよ！', 'いっしょに考えよう！']);
    banner = el('div', 'fb-banner bad pop-in',
      el('span', 'fb-face', '💪'), cheer,
      el('span', 'fb-sub', `こたえは 「${answerText(p)}」`));
  }
  fb.append(banner);
  if (!isCorrect) {
    /* 罰ゼロ設計の物語化: まちがえても「かんがえたひかり」が森に灯る、という
     * 淡い光の小演出のみ(✗表示・正しい答えの提示はそのまま変更しない)。 */
    fb.append(el('div', 'wrong-glow', el('span', 'glow-dot'), 'かんがえた ひかりが もりに ともったよ'));
  }

  /* 解説(正解でも不正解でも必ず表示) */
  const box = el('div', 'kaisetsu', el('h3', null, '🔎 とき方'));
  p.explain.steps.forEach((s, i) => {
    box.append(el('div', 'step',
      el('span', 'step-no num', String(i + 1)),
      el('span', null, fmt(s))));
  });
  box.append(renderVisual(p.explain.visual));
  box.append(el('div', 'kakunin num',
    `たしかめ算: ${p.explain.checkFormula}`,
    el('span', 'ok-mark', '✓ ぴったり！')));
  fb.append(box);

  /* とき方は正誤にかかわらず必ず表示される→そのつど「閲覧」としてカウント。
   * レア: ハカセミミ(累計10回) */
  game.stats.explainViews++;
  if (game.stats.explainViews >= HAKASEMIMI_EXPLAIN_VIEWS && !game.rares[12]) {
    game.rares[12] = true;
    recordMetAt(12);
    session.eventQueue.push({ type: 'catch', rare: true, id: 12 });
    session.caughtThisSession.push(12);
    checkCompCelebration();
  }
  saveGame();

  const last = state.index + 1 >= state.unit.questions;
  const nextBtn = el('button', 'btn-big next', last ? 'けっかを見る 🏁' : 'つぎのもんだいへ →');
  nextBtn.id = 'btn-next';
  nextBtn.addEventListener('click', () => {
    state.index++;
    drainEventQueue(() => {
      if (state.index >= state.unit.questions) {
        /* v5: クエスト結果画面への遷移時に、未読で条件成立のおはなしをキューへ */
        checkStoryTriggers();
        drainEventQueue(showResult);
      } else loadProblem();
    });
  });
  fb.append(nextBtn);
  nextBtn.focus({ preventScroll: true });
}

/* お皿にアイテムを並べる視覚化。数が多いときは文字を小さく */
function renderVisual(v) {
  const holder = document.createDocumentFragment();
  if (!v) return holder;
  const total = v.groups * v.groupSize + v.rest;
  const small = total > 36 ? ' small' : '';
  const plates = el('div', 'plates');
  for (let g = 0; g < v.groups; g++) {

/* ---------- celebration(正解のよろこびを全画面で) ---------- */
let audioCtx = null;
function playChime() {
  /* 「ピンポーン♪」。回答タップ(ユーザー操作)直後なので autoplay 制限に抵触しない */
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    [[784, 0], [1319, 0.14]].forEach(([freq, dt]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t + dt);
      gain.gain.exponentialRampToValueAtTime(0.16, t + dt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + dt); osc.stop(t + dt + 0.45);
    });
  } catch (e) { /* 音が出せない環境でも演出は続行 */ }
}

  const score = state.correct;
  /* 計測: クリア。問題単位の結果はここに集約する(1問ごとに送るとイベントが増えすぎる)。
   * questActive を先に落とすので、この後の show() は離脱扱いにならない。 */
  if (state.questActive) {
    state.questActive = false;
    sqTrack('quest_clear', {
      unit: state.unit.id,
      correct: score,
      total: total,
      best_streak: state.bestStreak,
      duration_sec: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : 0,
    });
    /* explain_views は送らない: このアプリの解説は正誤にかかわらず毎回表示される仕様(L1413付近)で、
     * game.stats.explainViews は実質「回答数」と同値。指標として意味がないので落とした(2026-07-25 実測)。 */
  }
  const rate = score / total;

    : rate >= 0.7 ? 'すごい！ あと少しで パーフェクト！'
    : rate >= 0.4 ? 'いいちょうし！ とき方を見て もう1回 チャレンジ！'
    : 'だいじょうぶ！ とき方を おもいだして もう1回！';

  card.append(
    el('div', 'result-stars', stars),
    el('div', 'result-score num', String(score), el('small', null, ` / ${total} もん せいかい`)),
    el('div', 'result-msg', msg));

  /* ゲーム層: きょうの成果 + 図鑑進捗 */
  const caughtNames = session.caughtThisSession.map(id => monsterById(id).name);
  const owned = countOwned();
  const gameBox = el('div', 'result-game',
    el('div', 'result-game-title', '🎒 きょうの せいか'),
    el('div', 'result-game-row', `といた もんだい: ${total}もん / せいかい: ${score}もん`),
    el('div', 'result-game-row', `ゲットした子: ${caughtNames.length ? caughtNames.join('、') : 'きょうは いなかったよ'}`),
    el('div', 'result-game-row num', `ずかん しんちょく: ${owned} / ${MONSTERS.length}`));
  const evoHint = evolutionHint();
  if (evoHint) gameBox.append(el('div', 'result-game-row', evoHint));
  if (owned < MONSTERS.length) {
    const tease = el('div', 'result-tease');
    for (const m of MONSTERS.filter(mm => !isMonsterOwned(mm)).slice(0, 3)) {
      const img = el('img', 'tease-img'); img.src = SILHOUETTE_IMG; img.alt = '？？？';
      tease.append(img);
    }
    gameBox.append(tease);
  }
  card.append(gameBox);

  const retry = el('button', 'btn-big', 'もういちど！');
  retry.addEventListener('click', () => startQuest(state.unit));
  const btns = [retry];
  if (game.candy > 0) {
    const feedBtn = el('button', 'btn-big ghost', `🍬 アメを あげにいく (${game.candy})`);
    feedBtn.addEventListener('click', () => { renderHome(); show('screen-home'); openFeedModal(); });
    btns.push(feedBtn);
  }
  const pokeBtn = el('button', 'btn-big ghost', 'ずかんを見る');
  pokeBtn.addEventListener('click', () => { renderPokedex(); show('screen-pokedex'); });
  const back = el('button', 'btn-big ghost', 'ぼうけんをえらぶ');
  back.addEventListener('click', goHome);
  btns.push(pokeBtn, back);
  card.append(el('div', 'result-btns', ...btns));

  recordDailyLog(state.unit, total, score);
  advanceMission('questClear', 1);

  show('screen-result');
}

/* ===== QR_ENCODE ここから ================================================
 * QR_ENCODE — 自己完結 QR コードエンコーダ(外部ライブラリ不使用)
 * byte mode 専用・誤り訂正レベル M 固定・バージョン自動選択(1〜10)。
 * ISO/IEC 18004 のアルゴリズム(qrcode-generator 系ライブラリと同じ考え方)を
 * このアプリの用途(短い ASCII セーブコードの符号化)に絞って縮小移植したもの。
 * ========================================================================= */
const QR_ENCODE = (function () {
  const PAD0 = 0xEC, PAD1 = 0x11;

  /* ---- GF(256) 対数/指数テーブル(生成多項式 x^8+x^4+x^3+x^2+1 = 0x11D) ---- */
  const EXP = new Array(256), LOG = new Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D;
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function gmul(a, b) {
    if (a === 0 || b === 0) return 0;
    return EXP[LOG[a] + LOG[b]];
  }

  /* ---- 多項式(係数配列・降べきの順) ---- */
  function polyMul(a, b) {
    const r = new Array(a.length + b.length - 1).fill(0);
    for (let i = 0; i < a.length; i++)
      for (let j = 0; j < b.length; j++)
        r[i + j] ^= gmul(a[i], b[j]);
    return r;
  }
  function rsGeneratorPoly(degree) {
    let g = [1];
    for (let i = 0; i < degree; i++) g = polyMul(g, [1, EXP[i]]);
    return g;
  }
  /* データ多項式を生成多項式で割った余り = 誤り訂正符号語 */
  function rsEncode(dataBytes, ecCount) {
    const gen = rsGeneratorPoly(ecCount);
    const msg = dataBytes.concat(new Array(ecCount).fill(0));
    for (let i = 0; i < dataBytes.length; i++) {
      const coef = msg[i];
      if (coef === 0) continue;
      for (let j = 0; j < gen.length; j++) msg[i + j] ^= gmul(gen[j], coef);
    }
    return msg.slice(dataBytes.length);
  }

  /* ---- バージョンごとの容量・ブロック構成(誤り訂正レベル M のみ) ----
   * 各行: [totalCodewords, ecCodewordsPerBlock, blocks: [[count, dataPerBlock], ...]] */
  const M_TABLE = {
    1:  { total: 26,  ecPerBlock: 10, blocks: [[1, 16]] },
    2:  { total: 44,  ecPerBlock: 16, blocks: [[1, 28]] },
    3:  { total: 70,  ecPerBlock: 26, blocks: [[1, 44]] },
    4:  { total: 100, ecPerBlock: 18, blocks: [[2, 32]] },
    5:  { total: 134, ecPerBlock: 24, blocks: [[2, 43]] },
    6:  { total: 172, ecPerBlock: 16, blocks: [[4, 27]] },
    7:  { total: 196, ecPerBlock: 18, blocks: [[4, 31]] },
    8:  { total: 242, ecPerBlock: 22, blocks: [[2, 38], [2, 39]] },
    9:  { total: 292, ecPerBlock: 22, blocks: [[3, 36], [2, 37]] },
    10: { total: 346, ecPerBlock: 26, blocks: [[4, 43], [1, 44]] },
  };
  const ALIGN_POS = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
  };
  function moduleCount(version) { return version * 4 + 17; }

  /* ---- ビットバッファ ---- */
  function BitBuffer() {
    return { bytes: [], bitLen: 0,
      put(num, len) {
        for (let i = len - 1; i >= 0; i--) this.putBit(((num >>> i) & 1) === 1);
      },
      putBit(bit) {
        const idx = Math.floor(this.bitLen / 8);
        if (this.bytes.length <= idx) this.bytes.push(0);
        if (bit) this.bytes[idx] |= (0x80 >>> (this.bitLen % 8));
        this.bitLen++;
      },
    };
  }

  function pickVersion(byteLen) {
    for (let v = 1; v <= 10; v++) {
      const t = M_TABLE[v];
      const dataCodewords = t.blocks.reduce((s, [c, n]) => s + c * n, 0);
      /* mode(4bit) + count(8bit, v1-9) + data + terminator余地 を概算チェック */
      const countBits = v <= 9 ? 8 : 16;
      const neededBits = 4 + countBits + byteLen * 8;
      if (Math.ceil(neededBits / 8) <= dataCodewords) return v;
    }
    throw new Error('QR_ENCODE: データが大きすぎます (max version10/M対応)');
  }

  /* ---- データ符号化(byte mode) ---- */
  function encodeData(version, bytes) {
    const buf = BitBuffer();
    buf.put(0b0100, 4); /* mode: byte */
    buf.put(bytes.length, version <= 9 ? 8 : 16);
    for (const b of bytes) buf.put(b, 8);

    const t = M_TABLE[version];
    const totalDataCodewords = t.blocks.reduce((s, [c, n]) => s + c * n, 0);
    const totalDataBits = totalDataCodewords * 8;

    /* terminator (最大4bit) */
    for (let i = 0; i < 4 && buf.bitLen < totalDataBits; i++) buf.putBit(false);
    /* 8bit境界に揃える */
    while (buf.bitLen % 8 !== 0) buf.putBit(false);
    /* パディングバイトで埋める */
    let padToggle = true;
    while (buf.bytes.length < totalDataCodewords) {
      buf.bytes.push(padToggle ? PAD0 : PAD1);
      padToggle = !padToggle;
    }
    return buf.bytes.slice(0, totalDataCodewords);
  }

  /* ---- ブロック分割 → RS符号 → インターリーブ ---- */
  function buildCodewords(version, dataBytes) {
    const t = M_TABLE[version];
    const dataBlocks = [];
    const ecBlocks = [];
    let offset = 0;
    for (const [count, n] of t.blocks) {
      for (let i = 0; i < count; i++) {
        const chunk = dataBytes.slice(offset, offset + n);
        offset += n;
        dataBlocks.push(chunk);
        ecBlocks.push(rsEncode(chunk, t.ecPerBlock));
      }
    }
    const maxData = Math.max(...dataBlocks.map(b => b.length));
    const out = [];
    for (let i = 0; i < maxData; i++)
      for (const b of dataBlocks) if (i < b.length) out.push(b[i]);
    for (let i = 0; i < t.ecPerBlock; i++)
      for (const b of ecBlocks) out.push(b[i]);
    return out;
  }

  /* ---- BCH(型番情報・フォーマット情報) ---- */
  function bchTypeInfo(data) {
    /* フォーマット情報: エラー訂正レベル(2bit)+マスクパターン(3bit) → 15bit BCH */
    const G = 0b10100110111;
    let d = data << 10;
    while (bitLength(d) - bitLength(G) >= 0) d ^= (G << (bitLength(d) - bitLength(G)));
    const bits = ((data << 10) | d) ^ 0b101010000010010;
    return bits;
  }
  function bitLength(n) { let l = 0; while (n !== 0) { l++; n >>>= 1; } return l; }
  function bchTypeNumber(version) {
    /* 型番情報(バージョン7以降で必要): 6bitのバージョン番号 + 12bit BCH誤り訂正 */
    const G = 0b1111100100101; /* 0x1F25 */
    let d = version << 12;
    while (bitLength(d) - bitLength(G) >= 0) d ^= (G << (bitLength(d) - bitLength(G)));
    return (version << 12) | d;
  }

  /* ---- マスク関数(8種)・ペナルティ評価は簡略化: パターン0を使用しつつ
   * 実用上問題なさそうな1パターンを固定選択(短いデータでは差が小さいため、
   * 複数マスクでペナルティ計算→最良選択まで行い品質を担保する) ---- */
  const MASK_FNS = [
    (r, c) => (r + c) % 2 === 0,
    (r, c) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0,
    (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0,
  ];

  function makeMatrix(version, maskIndex, codewords) {
    const n = moduleCount(version);
    const mat = Array.from({ length: n }, () => new Array(n).fill(null));
    const isFn = Array.from({ length: n }, () => new Array(n).fill(false));

    function set(r, c, v, fn) {
      if (r < 0 || r >= n || c < 0 || c >= n) return;
      mat[r][c] = v; if (fn) isFn[r][c] = true;
    }
    function placeFinder(r, c) {
      for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) {
        if (r + i < 0 || r + i >= n || c + j < 0 || c + j >= n) continue;
        const on = (i >= 0 && i <= 6 && (j === 0 || j === 6)) ||
          (j >= 0 && j <= 6 && (i === 0 || i === 6)) ||
          (i >= 2 && i <= 4 && j >= 2 && j <= 4);
        set(r + i, c + j, on, true);
      }
    }
    placeFinder(0, 0); placeFinder(n - 7, 0); placeFinder(0, n - 7);

    /* アライメントパターン(タイミングパターンより先に置く。
     * バージョン7以降は中間位置のアライメントパターンがタイミング列/行と
     * 重なるため、先に確保しないとタイミングパターンに上書きされてしまう) */
    const aps = ALIGN_POS[version];
    for (const r of aps) for (const c of aps) {

/* QR行列 → canvas描画(モジュールを塗りつぶし矩形で描くのでcanvas上でも
 * 拡大縮小によるボケがなく、そのままカメラ/デコーダで読み取れる)。 */
function drawQrToCanvas(canvas, text) {
  const mat = QR_ENCODE.encode(text);
  const n = mat.length;
  const quiet = 4; /* クワイエットゾーン(モジュール数) */
  const scale = 6; /* 1モジュールあたりのpx */
  const size = (n + quiet * 2) * scale;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (mat[r][c]) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
  }
}

 *  同じ <img src="..."> の使い方で描画されるため、呼び出し側の変更は不要) */
function svgUri(inner, vb) {

}

/* ---------- レベル/しんかの数値設計 ----------
 * LEVEL_UP_COST[i] = レベル(i+1)→(i+2)に必要ながくしゅうアメの数。最大レベル10。
 * しんか: レベル5でstage2、レベル10でstage3(最終形態)。 */
const LEVEL_UP_COST = [3, 4, 5, 6, 7, 8, 9, 10, 12];
function stageForLevel(level) { return level >= 10 ? 3 : level >= 5 ? 2 : 1; }
/* v5.2 §7-2: なかま加入ペース。ENCOUNTER_AT[所持数] = その次の1体を迎えるのに必要な累計正解数。
 * 所持数ベースの判定にしたことで、旧 nextEncounterAt(累計正解数+rand(2,3))方式のセーブとも
 * 自然に互換が取れる(所持数だけを見るので、旧方式で刻んだ値は単に無視される)。 */
const ENCOUNTER_AT = [2, 10, 22];
/* v5.2 §7-2: ハカセミミ(とき方の閲覧回数)。旧10回は自動カウントのため初日に出てしまっていた。
 * 既に取得済みのセーブは game.rares[12] のフラグ判定でガードされているため没収されない。 */
const HAKASEMIMI_EXPLAIN_VIEWS = 30;
/* 累計アメ(xp)からレベルを算出。しきい値の消費を状態として持たないので、
 * どの子も"取り残される"ことがない(全員ぶんの計算をいつでもやり直せる)。 */
function levelInfo(xp) {
  let level = 1, rem = xp, idx = 0;
  while (idx < LEVEL_UP_COST.length && rem >= LEVEL_UP_COST[idx]) { rem -= LEVEL_UP_COST[idx]; level++; idx++; }
  return { level, into: rem, needed: idx < LEVEL_UP_COST.length ? LEVEL_UP_COST[idx] : null };
}
function levelOf(lineId) { return levelInfo(game.lines[lineId].xp).level; }
function isMonsterOwned(m) {
  if (m.kind === 'rare') return !!game.rares[m.id];
  const line = game.lines[m.lineId];
  return line.owned && stageForLevel(levelOf(m.lineId)) >= m.stage;
}
function countOwned() { return MONSTERS.filter(isMonsterOwned).length; }
/* 手持ちの子のうち、しんかに一番近い子のヒント文(結果画面用)。
 * 特定の1体に固定しない = 複数の子を並行で育てても誰も置き去りにならない。 */
function evolutionHint() {
  let best = null;
  for (const lineId of [1, 2, 3, 4, 5, 6]) {
    const line = game.lines[lineId];
    if (!line.owned) continue;
    const level = levelOf(lineId);
    const stage = stageForLevel(level);
    if (stage >= 3) continue; /* 最終形態はしんかなし */
    const targetLevel = stage === 1 ? 5 : 10;
    const levelsLeft = targetLevel - level;
    if (levelsLeft <= 0) continue;
    if (!best || levelsLeft < best.levelsLeft) best = { lineId, stage, levelsLeft };
  }
  if (!best) return null;
  const m = MONSTERS.find(mm => mm.lineId === best.lineId && mm.stage === best.stage);
  return best.levelsLeft <= 2
    ? `🌟 ${m.name} は しんかまで あとすこし！`
    : `🌟 ${m.name} は しんかまで あと${best.levelsLeft}レベル！`;
}

function mergeIntoDefault(p) {
  const d = defaultGame();
  const mergedStats = Object.assign(d.stats, p.stats);
  /* v6 Phase4a 追補B-1: 移行処理(必須)。既存セーブ(p.stats に divCorrect が無い)は、
   * Phase4a 以前は かけ算が存在せず totalCorrect が全てわり算由来だったため、
   * divCorrect の初期値を既存の totalCorrect で埋める。0から始めると「次のなかま」までの
   * 進捗が巻き戻ってしまうため必須の処理(新規セーブは p.stats が無い/divCorrect ありのため対象外)。 */
  if (p && p.stats && p.stats.divCorrect === undefined) {
    mergedStats.divCorrect = mergedStats.totalCorrect;
  }
  return Object.assign(d, p, {
    lines: Object.assign(d.lines, p.lines),
    rares: Object.assign(d.rares, p.rares),
    stats: mergedStats,
    catchOrder: Array.isArray(p.catchOrder) ? p.catchOrder : d.catchOrder,
    story: {
      read: Object.assign({}, d.story.read, p.story && p.story.read),
      meta: Object.assign({}, d.story.meta, p.story && p.story.meta),
    },
    metAt: Object.assign({}, d.metAt, p.metAt),
  });
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return mergeIntoDefault(JSON.parse(raw));
  } catch (e) { /* v2セーブが壊れていたら旧セーブの移行を試みる */ }
  try {
    const legacyRaw = localStorage.getItem(LEGACY_SAVE_KEY);
    if (!legacyRaw) return null;
    const legacy = JSON.parse(legacyRaw);
    delete legacy.balls; /* v4: ゲットボールは廃止。捨てて移行 */
    const migrated = mergeIntoDefault(legacy);
    saveGameObj(migrated);
    try { localStorage.removeItem(LEGACY_SAVE_KEY); } catch (e) { /* 消せなくても続行 */ }
    return migrated;
  } catch (e) { return null; }
}
function saveGameObj(obj) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); } catch (e) { /* 保存できなくても続行 */ }
}
function saveGame() { saveGameObj(game); }


/* ---------- たべさせる(給餌)によるレベルアップ ----------
 * v4: 自動吸収は廃止。ホーム/ずかんで選んだ1ラインにだけアメを渡す。
 * レベル10(累計アメ64)で満タン=それ以上は渡せない(アメを無駄にしない)。 */
const MAX_LINE_XP = LEVEL_UP_COST.reduce((s, n) => s + n, 0);
function feedCandy(lineId, amount) {
  const line = game.lines[lineId];
  if (!line || !line.owned) return { fed: 0, events: [] };
  const room = MAX_LINE_XP - line.xp;
  const fed = Math.max(0, Math.min(amount, room, game.candy));
  if (fed <= 0) return { fed: 0, events: [] };
  const before = levelInfo(line.xp).level;
  line.xp += fed;
  game.candy -= fed;
  const after = levelInfo(line.xp).level;
  const events = [];
  if (after > before) {
    const evolved = stageForLevel(after) > stageForLevel(before);
    events.push({ type: 'levelup', lineId, from: before, to: after });
    if (evolved) {
      events.push({ type: 'evolve', lineId, fromStage: stageForLevel(before), toStage: stageForLevel(after) });
      const evolvedMonster = MONSTERS.find(mm => mm.lineId === lineId && mm.stage === stageForLevel(after));
      if (evolvedMonster) recordMetAt(evolvedMonster.id);
    }
  }
  advanceMission('feed', 1);
  saveGame();
  return { fed, events };
}

const MISSION_POOL = [
  { id: 'c3', metric: 'correct', target: 3, label: 'きょう 3もん せいかいしよう' },
  { id: 'c5', metric: 'correct', target: 5, label: 'きょう 5もん せいかいしよう' },

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function simpleHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function ensureMission() {
  const today = todayStr();
  if (game.mission && game.mission.date === today) return;
  const def = MISSION_POOL[simpleHash(today) % MISSION_POOL.length];
  game.mission = { date: today, id: def.id, progress: 0, done: false, rewarded: false };
}
function currentMissionDef() { return MISSION_POOL.find(m => m.id === game.mission.id); }
/* 未達ペナルティなし・翌日は ensureMission() が自動リセット。達成でアメ+3(即時反映)。 */

  game.mission.progress = metric === 'streak' ? Math.max(game.mission.progress, amount) : game.mission.progress + amount;
  if (game.mission.progress >= def.target) {
    game.mission.progress = def.target;
    game.mission.done = true;
    if (!game.mission.rewarded) {
      game.mission.rewarded = true;
      game.candy += 3;
      session.eventQueue.push({ type: 'mission' });
    }
  }
  saveGame();
}

/* ---------- 全体コンプ解禁演出(初回のみ) ----------
 * v6 Phase4a: 12 → MONSTERS.length(24)。ハードコードを避けて図鑑の総数変化に自動追従する。 */
function checkCompCelebration() {
  if (!game.compCelebrated && countOwned() === MONSTERS.length) {
    game.compCelebrated = true;
    session.eventQueue.push({ type: 'comp' });
  }
}

/* ---------- 正解時のごほうび処理(grade()からフック) ----------
 * ✗のときは絶対に呼ばれない = 罰ゼロ設計。アメはインベントリに貯まるだけで、
 * レベルアップは feedCandy()(たべさせる操作)からのみ発生する。 */
function processCorrectAnswer() {
  game.stats.totalCorrect++;
  if (game.stats.bestStreak < state.streak) game.stats.bestStreak = state.streak;
  game.candy += 2; /* v5.2 §7-4: 正解1問 = アメ2つ */
  advanceMission('correct', 1);
  advanceMission('streak', state.streak);

  /* レア: キラリス(5問連続正解) */
  if (state.streak === 5 && !game.rares[10]) {
    game.rares[10] = true;
    recordMetAt(10);
    session.eventQueue.push({ type: 'catch', rare: true, id: 10 });
    session.caughtThisSession.push(10);
  }

  /* v6 Phase4a 追補B-1: エリアの対称化。森の加入判定は totalCorrect(全単元)ではなく
   * divCorrect(わり算のみ)を見る。4bで物語がライン所持を見て進行する際、かけ算しか
   * 遊んでいない子に かずのもりの物語が進んでしまうのを防ぐため。totalCorrect 自体の
   * 意味(全単元の累計)は変えない。 */
  const isDivUnit = !!(state.unit && typeof state.unit.id === 'string' && state.unit.id.startsWith('div-'));
  if (isDivUnit) game.stats.divCorrect++;

  /* であい→なかまになる(まだ手に入れていないラインの中から抽選・必ず なかまになる)
   * v5.2 §7-2: 所持数ベースの閾値(ENCOUNTER_AT)で判定。旧 nextEncounterAt 方式のセーブとも、
   * 所持数だけを見ることで自然に互換が取れる(この関数ではもう更新しない・値はQRセーブ形式維持のため残置)。 */
  const ownedCount = [1, 2, 3].filter(l => game.lines[l].owned).length;
  if (ownedCount < ENCOUNTER_AT.length && game.stats.divCorrect >= ENCOUNTER_AT[ownedCount]) {
    const avail = [1, 2, 3].filter(l => !game.lines[l].owned);
    if (avail.length) {
      const lineId = pick(avail);
      game.lines[lineId].owned = true;
      game.activeLine = lineId;
      game.catchOrder.push(lineId); /* 相棒ホームの同率タイブレーク用(最後に仲間になった子) */
      recordMetAt(starterIdOf(lineId));
      session.eventQueue.push({ type: 'catch', rare: false, id: starterIdOf(lineId) });
      session.caughtThisSession.push(starterIdOf(lineId));
      checkCompCelebration();
    }
  }

  /* ---------- v6 Phase4a: かざんエリア(かけ算)専用の加入導線・レア条件 ----------
   * 佐々木さん裁定(2026-07-18): 累計トリガーは「かざんエリア内カウント」= mulCorrect。
   * かずのもりの totalCorrect とは別に数える。かけ算単元(mul-*)で正解したときのみ。 */
  const isMulUnit = !!(state.unit && typeof state.unit.id === 'string' && state.unit.id.startsWith('mul-'));
  if (isMulUnit) {
    game.stats.mulCorrect++;
    const d = state.problem && state.problem.d;

    /* かざんのなかま加入: ENCOUNTER_AT と同じ考え方・同じ値を、かざんの所持数ベースで使う */
    const kazanOwnedCount = [4, 5, 6].filter(l => game.lines[l].owned).length;
    if (kazanOwnedCount < ENCOUNTER_AT.length && game.stats.mulCorrect >= ENCOUNTER_AT[kazanOwnedCount]) {
      const kazanAvail = [4, 5, 6].filter(l => !game.lines[l].owned);
      if (kazanAvail.length) {
        const lineId = pick(kazanAvail);
        game.lines[lineId].owned = true;
        game.activeLine = lineId;
        game.catchOrder.push(lineId);
        recordMetAt(starterIdOf(lineId));
        session.eventQueue.push({ type: 'catch', rare: false, id: starterIdOf(lineId) });
        session.caughtThisSession.push(starterIdOf(lineId));
        checkCompCelebration();
      }
    }

    /* レア23 ゼロビ: 0のかけ算(mulZero由来)に正解。積(p)が0になるのは mulZero の
     * do-whileループで必ず a か b を0にした場合のみ(他の生成器は allowZero:false)。 */
    if (d && d.p === 0 && !game.rares[23]) {
      game.rares[23] = true;
      recordMetAt(23);
      session.eventQueue.push({ type: 'catch', rare: true, id: 23 });
      session.caughtThisSession.push(23);
      checkCompCelebration();
    }
    /* レア24 ビュンビ: かけ算で5問連続正解。既存キラリス(rare10)と同じ「state.streak」の
     * しくみをそのまま使い、いま遊んでいるのが かけ算単元のときだけ判定する。 */
    if (state.streak === 5 && !game.rares[24]) {
      game.rares[24] = true;
      recordMetAt(24);
      session.eventQueue.push({ type: 'catch', rare: true, id: 24 });
      session.caughtThisSession.push(24);
      checkCompCelebration();
    }
    /* レア25 オヨソン: 見積り問題(mulEstimate由来)に累計10問正解 */
    if (d && d.variant === 'estimate') {
      game.stats.estimateCorrect++;
      if (game.stats.estimateCorrect >= 10 && !game.rares[25]) {
        game.rares[25] = true;
        recordMetAt(25);
        session.eventQueue.push({ type: 'catch', rare: true, id: 25 });
        session.caughtThisSession.push(25);
        checkCompCelebration();
      }
    }
  }
}

/* 相棒: v5.2 §7-5でgame.partnerId(選択したライン)を優先。未選択、または選択先を
 * 手に入れていない(セーブの手動編集などで所持解除された)場合は、いちばんレベルが高い子
 * (同率なら最後に仲間になった子)に自動フォールバックする。0体ならnull。 */
function partnerLineId() {
  /* v6 Phase4a 追補B-2: 相棒選択の対象をライン1〜6(かずのもり+かざん)に拡張。
   * 構造(自動フォールバック・同率タイブレーク)は変えず、対象ラインを広げるだけ。 */
  const owned = [1, 2, 3, 4, 5, 6].filter(l => game.lines[l].owned);
  if (!owned.length) return null;
  if (game.partnerId && owned.includes(game.partnerId)) return game.partnerId;
  let maxLv = -1, candidates = [];
  for (const l of owned) {
    const lv = levelOf(l);
    if (lv > maxLv) { maxLv = lv; candidates = [l]; }
    else if (lv === maxLv) candidates.push(l);
  }
  if (candidates.length === 1) return candidates[0];
  for (let i = game.catchOrder.length - 1; i >= 0; i--) {
    if (candidates.includes(game.catchOrder[i])) return game.catchOrder[i];
  }
  return candidates[candidates.length - 1];
}

 * position:fixed の小さな画像を画面隅に常駐表示。タップ不可(pointer-events:none)。
 * 数字パッド・こたえあわせボタンとは重ならない配置(CSSで確保)。show()から表示/非表示を切り替え、
 * celebrate()(正解時)からぴょんと跳ねるアニメをフックする(prefers-reduced-motion時は無効)。 */

}

        const oneBtn = el('button', 'feed-btn', 'あげる (-1)');

/* ---------- あいことば(セーブコード) ----------
 * 数値配列 → カンマ区切り文字列 → base64url + チェックサム(2桁base36)。
 * localStorage が消えても、この文字列を貼り直せば復元できる。 */
function checksumOf(raw) {
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum = (sum * 31 + raw.charCodeAt(i)) >>> 0;
  return (sum % 1296).toString(36).padStart(2, '0');
}
function buildPassphrase() {
  const vals = [
    game.candy, game.activeLine || 0,
    game.lines[1].owned ? 1 : 0, game.lines[1].xp,
    game.lines[2].owned ? 1 : 0, game.lines[2].xp,
    game.lines[3].owned ? 1 : 0, game.lines[3].xp,
    game.rares[10] ? 1 : 0, game.rares[11] ? 1 : 0, game.rares[12] ? 1 : 0,
    game.stats.totalAnswered, game.stats.totalCorrect, game.stats.explainViews, game.stats.bestStreak,
    game.nextEncounterAt,
  ];
  const raw = vals.join(',');
  const payload = btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `SQ2-${payload}-${checksumOf(raw)}`;
}
/* SQ2(v4・ボールなし・16値)を正規に受け付け、旧SQ1(ボールあり・17値)の
 * 貼り付けも後方互換で受理して、balls を捨てて同じ状態に変換する。 */
function applyPassphrase(code) {
  const trimmed = String(code || '').trim();
  const m2 = trimmed.match(/^SQ2-([A-Za-z0-9\-_]+)-([0-9a-z]{2})$/);
  const m1 = !m2 ? trimmed.match(/^SQ1-([A-Za-z0-9\-_]+)-([0-9a-z]{2})$/) : null;
  const m = m2 || m1;
  if (!m) return { ok: false, msg: 'コードのかたちが ちがうみたい。もう一度 かくにんしてね。' };
  const payload = m[1].replace(/-/g, '+').replace(/_/g, '/');
  const pad = payload.length % 4 === 0 ? '' : '='.repeat(4 - payload.length % 4);
  let raw;
  try { raw = atob(payload + pad); } catch (e) { return { ok: false, msg: 'コードが よみとれなかったよ。' }; }
  if (checksumOf(raw) !== m[2]) return { ok: false, msg: 'コードが正しくないみたい。もう一度 コピーしてね。' };
  let vals = raw.split(',').map(Number);
  if (vals.some(v => !Number.isFinite(v))) return { ok: false, msg: 'コードの中身が おかしいよ。' };
  if (m1) {
    if (vals.length !== 17) return { ok: false, msg: 'コードの中身が おかしいよ。' };
    vals = vals.slice(1); /* 先頭の balls(v4で廃止)を捨てて新形式に合わせる */
  }
  if (vals.length !== 16) return { ok: false, msg: 'コードの中身が おかしいよ。' };
  const [candy, activeLine, l1o, l1xp, l2o, l2xp, l3o, l3xp, r10, r11, r12,
    totalAnswered, totalCorrect, explainViews, bestStreak, nextEncounterAt] = vals;
  game.candy = candy; game.activeLine = activeLine || null;
  game.lines[1] = { owned: !!l1o, xp: Math.max(0, l1xp || 0) };
  game.lines[2] = { owned: !!l2o, xp: Math.max(0, l2xp || 0) };
  game.lines[3] = { owned: !!l3o, xp: Math.max(0, l3xp || 0) };
  /* 復元時は実際の入手順が分からないため、ライン番号順で代用(タイブレークのみに影響) */
  game.catchOrder = [1, 2, 3].filter(l => game.lines[l].owned);
  game.rares[10] = !!r10; game.rares[11] = !!r11; game.rares[12] = !!r12;
  /* v6 Phase4a: 丸ごと置き換えず Object.assign にする。SQ2コードは かざん分(mulCorrect等)を
   * 運ばないため、丸ごと置き換えると復元のたびに かざんの進捗カウンタが消えてしまう。 */
  game.stats = Object.assign({}, game.stats, { totalAnswered, totalCorrect, explainViews, bestStreak });
  game.nextEncounterAt = nextEncounterAt || (totalCorrect + 2);
  game.introSeen = true;
  game.compCelebrated = countOwned() === MONSTERS.length;
  game.partnerId = null; /* v5.2 §7-5: 相棒選択はQRセーブに含めない。復元後は自動選出に戻し、再選択させる */
  saveGame();
  return { ok: true };
}

/* ---------- 起動時のQR自動復元(location.hashの sq= を検出) ---------- */
function restoreFromHash() {
  const hash = location.hash || '';
  const idx = hash.indexOf('sq=');
  if (idx === -1) return false;
  let code = hash.slice(idx + 3);
  try { code = decodeURIComponent(code); } catch (e) { /* 単純な文字列ならそのまま使う */ }
  const res = applyPassphrase(code);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 失敗しても続行 */ }
  return res.ok;
}
function showToast(msg) {
  const t = el('div', 'toast-msg', msg);
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2400);
}

const LOG_KEY = 'sq_log_v1';
function loadLog() {
  try { const raw = localStorage.getItem(LOG_KEY); const arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; }
  catch (e) { return []; }
}
function saveLog(arr) { try { localStorage.setItem(LOG_KEY, JSON.stringify(arr)); } catch (e) { /* 保存できなくても続行 */ } }
function recordDailyLog(unit, total, correct) {
  let log = loadLog();
  log.push({ date: todayStr(), unitId: unit.id, unitTitle: unit.title, total, correct });
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 13); /* 直近14日(今日含む) */
  const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
  log = log.filter(e => e.date >= cutoffStr);
  saveLog(log);
}
function renderParentScreen() {
  const root = $('screen-parent'); root.replaceChildren();

  const log = loadLog().slice().sort((a, b) => b.date.localeCompare(a.date));
  const totalQ = log.reduce((s, e) => s + e.total, 0);
  const totalC = log.reduce((s, e) => s + e.correct, 0);
  const days = new Set(log.map(e => e.date)).size;

  if (!log.length) {

    '記録はお子さまの端末内(ブラウザのlocalStorage)にのみ保存され、外部には送信されません。直近14日分を保持し、それより古い記録は自動的に削除されます。'));

/* ---------- v6 Phase4b: かざん14話(STORYへadditive追加。既存かずのもり14話は不可侵) ----------
 * 表示順は専用の順序配列(STORY_ORDER_KAZAN)で管理する(既存STORY_ORDERの中身は変えない)。
 * 台本は docs/kazan-story-bible.md §2 から一字一句コピー(機械生成・手打ちなし)。
 * 終話(k-ending)の scene のみ、契約2-2により bible記載のK1ではなくK10を使う
 * (K1を「火が消えた冷たい火山」へ作り直したため、かざん復活後の終話に使うと矛盾するための決定)。 */
const STORY_ORDER_KAZAN = ['k-prologue', 'k1-1', 'k1-2', 'k1-3', 'k2-1', 'k2-2', 'k2-3', 'k3-1', 'k3-2', 'k3-3', 'k4-1', 'k4-2', 'k4-3', 'k-ending'];

/* 「かざん回答数」「かざんでのミス経験」は新しいカウンタを増やさず、既存の mulCorrect(Phase4a)と
 * 既存のつまずき記録(loadMiss()・sq_miss_v1、game/SAVE_KEYとは別のlocalStorageキー)から導出する。
 * かけ算の全生成器は単一フィールド(q)のみなので、不正解は必ず classifyMiss() で分類されて
 * recordMiss() に記録される(nullで握りつぶされるケースが無いことは classifyMiss() 側の
 * 分岐が網羅的であることから保証される)。 */
const KAZAN_UNIT_IDS = ['mul-basic', 'mul-big', 'mul-tech', 'mul-word'];
function kazanMissCount() {
  const m = loadMiss();
  let n = 0;
  for (const u of KAZAN_UNIT_IDS) {
    const byCat = m.byUnit[u];
    if (byCat) for (const k in byCat) n += byCat[k];
  }
  return n;
}
function kazanAnsweredApprox() { return game.stats.mulCorrect + kazanMissCount(); }
function kazanHasMistake() { return kazanMissCount() > 0; }
